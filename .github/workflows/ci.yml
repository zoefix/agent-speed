name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  spec:
    name: Spec reference
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Install zstd
        run: command -v zstd || (sudo apt-get update && sudo apt-get install -y zstd)
      - name: Check fixtures with the reference implementation
        run: python3 spec/tools/reference.py --check-fixtures
      - name: Check reporting and profile contracts
        run: |
          python3 spec/tools/report_reference.py
          python3 spec/tools/execution_modes_reference.py
          python3 spec/tools/test_reporting_extensions.py
      - name: Validate vehicle art
        run: python3 spec/tools/vehicles.py
      - name: Lint installer
        run: shellcheck install.sh

  macos:
    name: macOS
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v5
      - name: Select newest Xcode
        run: |
          xcode="$(ls -d /Applications/Xcode*.app | grep -viE 'beta|_rc|release_candidate' | sort -V | tail -1)"
          sudo xcode-select -s "$xcode"
          echo "::notice::$(xcodebuild -version | tr '\n' ' ')"
      - name: Test core
        working-directory: macos
        run: |
          set -o pipefail
          swift test 2>&1 | tee "$RUNNER_TEMP/test.log" || {
            grep -E '✘ Test [^ ]+ (recorded|failed)|error:' "$RUNNER_TEMP/test.log" | head -10 | while IFS= read -r line; do echo "::error::$line"; done
            exit 1
          }
      - name: Build app bundle
        run: macos/scripts/build-app.sh
      - uses: actions/upload-artifact@v7
        with:
          name: AgentSpeed-macOS
          path: dist/AgentSpeed-macOS.zip
          if-no-files-found: error

  windows:
    name: Windows
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 10.0.x
      - name: Test core
        shell: bash
        run: |
          set -o pipefail
          dotnet test shared/tests/AgentSpeed.Core.Tests -c Release 2>&1 | tee "$RUNNER_TEMP/core.log" || {
            names="$(grep -oE '^\s*Failed [A-Za-z0-9_.]+' "$RUNNER_TEMP/core.log" | sed -E 's/^\s*Failed //; s/^AgentSpeed\.[A-Za-z]+\.Tests\.//' | sort -u | paste -sd',' -)"
            echo "::error::Failed tests: ${names:0:3500}"
            grep -E -A2 '^\s*Failed [A-Za-z]' "$RUNNER_TEMP/core.log" | grep -E 'Error Message' -A1 | grep -vE 'Error Message|^--' | sed -E 's/[0-9a-f]{32}//g' | sort | uniq -c | sort -rn | head -8 | while IFS= read -r line; do echo "::error::${line:0:600}"; done
            exit 1
          }
      - name: Test presentation
        if: ${{ !cancelled() }}
        shell: bash
        run: |
          set -o pipefail
          dotnet test shared/tests/AgentSpeed.Presentation.Tests -c Release 2>&1 | tee "$RUNNER_TEMP/presentation.log" || {
            names="$(grep -oE '^\s*Failed [A-Za-z0-9_.]+' "$RUNNER_TEMP/presentation.log" | sed -E 's/^\s*Failed //; s/^AgentSpeed\.[A-Za-z]+\.Tests\.//' | sort -u | paste -sd',' -)"
            echo "::error::Failed tests: ${names:0:3500}"
            grep -E -A2 '^\s*Failed [A-Za-z]' "$RUNNER_TEMP/presentation.log" | grep -E 'Error Message' -A1 | grep -vE 'Error Message|^--' | sed -E 's/[0-9a-f]{32}//g' | sort | uniq -c | sort -rn | head -8 | while IFS= read -r line; do echo "::error::${line:0:600}"; done
            exit 1
          }
      - name: Test traffic helper
        run: dotnet test windows/tests/AgentSpeed.TrafficHelper.Tests -c Release
      - name: Publish
        shell: pwsh
        run: ./windows/scripts/publish.ps1
      - uses: actions/upload-artifact@v7
        with:
          name: AgentSpeed-Windows
          path: dist/AgentSpeed-Windows-*.zip
          if-no-files-found: error

  linux:
    name: Linux (Ubuntu 24.04 / X11)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 10.0.x
      - name: Install Linux build dependencies
        run: sudo apt-get update && sudo apt-get install -y clang libbpf-dev libelf-dev zlib1g-dev linux-tools-common linux-tools-generic xvfb libfontconfig1 libgl1 shellcheck fonts-noto-cjk
      - name: Verify generated shaders
        run: python3 linux/scripts/sync-shaders.py --check
      - name: Test shared core and presentation
        run: |
          dotnet test shared/tests/AgentSpeed.Core.Tests -c Release
          dotnet test shared/tests/AgentSpeed.Presentation.Tests -c Release
      - name: Test Linux rendering and platform integration
        run: dotnet test linux/tests/AgentSpeed.Linux.Tests -c Release
      - name: X11 application smoke test
        run: xvfb-run -a sh linux/scripts/smoke-test.sh
      - name: Check shell scripts
        run: shellcheck install-linux.sh linux/scripts/*.sh linux/traffic-helper/build.sh linux/packaging/install-traffic-helper
      - name: Test GNOME panel layout and connection lifecycle
        run: node --test linux/tests/test_gnome_extension.mjs
      - name: Test Linux installer boundaries
        run: python3 linux/tests/test_installer.py
      - name: Test helper idle clock
        run: python3 linux/tests/test_traffic_helper_clock.py
      - name: Build Debian package
        run: sh linux/scripts/publish.sh
      - uses: actions/upload-artifact@v7
        with:
          name: AgentSpeed-Linux
          path: dist/AgentSpeed-Linux-x64.deb
          if-no-files-found: error
