name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  spec:
    name: Spec reference
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Install zstd and brotli
        run: (command -v zstd && command -v brotli) || (sudo apt-get update && sudo apt-get install -y zstd brotli)
      - name: Check fixtures with the reference implementation
        run: python3 spec/tools/reference.py --check-fixtures
      - name: Check reporting and profile contracts
        run: |
          python3 spec/tools/report_reference.py
          python3 spec/tools/execution_modes_reference.py
          python3 spec/tools/test_reporting_extensions.py
          python3 spec/tools/lan_reference.py --check-fixtures
          python3 spec/tools/quota_reference.py --check-fixtures
      - name: Validate vehicle art
        run: python3 spec/tools/vehicles.py
      - name: Lint installer
        run: shellcheck install.sh

  relay:
    name: Remote relay (${{ matrix.arch }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: x86_64
            runner: ubuntu-24.04
          - arch: aarch64
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v5
      - name: Build static relay
        run: linux/relay/build-static.sh ${{ matrix.arch }}
      - uses: actions/upload-artifact@v7
        with:
          name: relay-${{ matrix.arch }}
          path: linux/relay/dist/agent-speed-relay-linux-${{ matrix.arch }}
          if-no-files-found: error

  macos:
    name: macOS
    needs: relay
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v5
      # The tests read the embedded relays as the app bundle does.
      - uses: actions/download-artifact@v7
        with:
          pattern: relay-*
          path: linux/relay/dist
          merge-multiple: true
      - name: Select newest Xcode
        run: |
          xcode="$(ls -d /Applications/Xcode*.app | grep -viE 'beta|_rc|release_candidate' | sort -V | tail -1)"
          sudo xcode-select -s "$xcode"
          echo "::notice::$(xcodebuild -version | tr '\n' ' ')"
      - name: Test core
        working-directory: macos
        run: |
          set -o pipefail
          # The suites with network round trips (and their timeouts) run after the rest, on their own: with every test
          # started at once, a small runner can starve them past their timeouts.
          network='HTTPFetcherTests|LanNetworkTests|Report(Discovery|DiscoveryFailure|EndToEnd|Invite|Profile|StreamEndToEnd)Tests'
          { swift test --skip "$network" && swift test --filter "$network"; } 2>&1 | tee "$RUNNER_TEMP/test.log" || {
            grep -E '✘ Test [^ ]+ (recorded|failed)|error:' "$RUNNER_TEMP/test.log" | head -10 | while IFS= read -r line; do echo "::error::$line"; done
            exit 1
          }
      - name: Test update relaunch
        timeout-minutes: 5
        run: python3 macos/scripts/test-update-relaunch.py
      - name: Build app bundle
        run: macos/scripts/build-app.sh
      - uses: actions/upload-artifact@v7
        with:
          name: AgentSpeed-macOS
          path: dist/AgentSpeed-macOS.zip
          if-no-files-found: error

  windows:
    name: Windows
    needs: relay
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v5
      # The tests read the embedded relays as the published app does.
      - uses: actions/download-artifact@v7
        with:
          pattern: relay-*
          path: linux/relay/dist
          merge-multiple: true
      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 10.0.x
      - name: Test core
        shell: bash
        run: |
          set -o pipefail
          dotnet test windows/tests/AgentSpeed.Core.Tests -c Release 2>&1 | tee "$RUNNER_TEMP/core.log" || {
            names="$(grep -oE '^\s*Failed [A-Za-z0-9_.]+' "$RUNNER_TEMP/core.log" | sed -E 's/^\s*Failed //; s/^AgentSpeed\.[A-Za-z]+\.Tests\.//' | sort -u | paste -sd',' -)"
            echo "::error::Failed tests: ${names:0:3500}"
            grep -E -A2 '^\s*Failed [A-Za-z]' "$RUNNER_TEMP/core.log" | grep -E 'Error Message' -A1 | grep -vE 'Error Message|^--' | sed -E 's/[0-9a-f]{32}//g' | sort | uniq -c | sort -rn | head -8 | while IFS= read -r line; do echo "::error::${line:0:600}"; done
            exit 1
          }
      - name: Test presentation
        if: ${{ !cancelled() }}
        shell: bash
        run: |
          set -o pipefail
          dotnet test windows/tests/AgentSpeed.Presentation.Tests -c Release 2>&1 | tee "$RUNNER_TEMP/presentation.log" || {
            names="$(grep -oE '^\s*Failed [A-Za-z0-9_.]+' "$RUNNER_TEMP/presentation.log" | sed -E 's/^\s*Failed //; s/^AgentSpeed\.[A-Za-z]+\.Tests\.//' | sort -u | paste -sd',' -)"
            echo "::error::Failed tests: ${names:0:3500}"
            grep -E -A2 '^\s*Failed [A-Za-z]' "$RUNNER_TEMP/presentation.log" | grep -E 'Error Message' -A1 | grep -vE 'Error Message|^--' | sed -E 's/[0-9a-f]{32}//g' | sort | uniq -c | sort -rn | head -8 | while IFS= read -r line; do echo "::error::${line:0:600}"; done
            exit 1
          }
      - name: Test traffic helper
        run: dotnet test windows/tests/AgentSpeed.TrafficHelper.Tests -c Release
      - name: Test status line helper
        run: dotnet test windows/tests/AgentSpeed.StatuslineHelper.Tests -c Release
      - name: Publish
        shell: pwsh
        run: ./windows/scripts/publish.ps1
      - uses: actions/upload-artifact@v7
        with:
          name: AgentSpeed-Windows
          path: dist/AgentSpeed-Windows-*.zip
          if-no-files-found: error
