name: Release

on:
  push:
    tags: ['v*']

permissions:
  contents: read

jobs:
  spec:
    name: Release contracts
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Check version and contracts
        run: |
          test "$(cat VERSION)" = "${GITHUB_REF_NAME#v}"
          python3 spec/tools/report_reference.py
          python3 spec/tools/execution_modes_reference.py
          python3 spec/tools/test_reporting_extensions.py

  macos:
    name: macOS
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v5
      - name: Select newest Xcode
        run: |
          xcode="$(ls -d /Applications/Xcode*.app | grep -viE 'beta|_rc|release_candidate' | sort -V | tail -1)"
          sudo xcode-select -s "$xcode"
          echo "::notice::$(xcodebuild -version | tr '\n' ' ')"
      - name: Test core
        working-directory: macos
        run: swift test
      - name: Build app bundle
        run: macos/scripts/build-app.sh --version "${GITHUB_REF_NAME#v}"
      - uses: actions/upload-artifact@v7
        with:
          name: AgentSpeed-macOS
          path: dist/AgentSpeed-macOS.zip
          if-no-files-found: error

  windows:
    name: Windows
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 10.0.x
      - name: Test core
        run: dotnet test shared/tests/AgentSpeed.Core.Tests -c Release
      - name: Test presentation
        run: dotnet test shared/tests/AgentSpeed.Presentation.Tests -c Release
      - name: Test traffic helper
        run: dotnet test windows/tests/AgentSpeed.TrafficHelper.Tests -c Release
      - name: Publish
        shell: pwsh
        run: ./windows/scripts/publish.ps1 -Version $env:GITHUB_REF_NAME.TrimStart('v')
      - uses: actions/upload-artifact@v7
        with:
          name: AgentSpeed-Windows
          path: dist/AgentSpeed-Windows-*.zip
          if-no-files-found: error

  linux:
    name: Linux
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 10.0.x
      - name: Install build dependencies
        run: sudo apt-get update && sudo apt-get install -y clang libbpf-dev libelf-dev zlib1g-dev linux-tools-common linux-tools-generic xvfb libfontconfig1 libgl1 fonts-noto-cjk
      - name: Verify Linux build
        run: |
          node --test linux/tests/test_gnome_extension.mjs
          python3 linux/tests/test_traffic_helper_clock.py
          python3 linux/scripts/sync-shaders.py --check
          dotnet test shared/tests/AgentSpeed.Core.Tests -c Release
          dotnet test shared/tests/AgentSpeed.Presentation.Tests -c Release
          dotnet test linux/tests/AgentSpeed.Linux.Tests -c Release
          xvfb-run -a sh linux/scripts/smoke-test.sh
      - name: Publish Linux package
        env:
          AGENT_SPEED_VERSION: ${{ github.ref_name }}
        run: AGENT_SPEED_VERSION="${AGENT_SPEED_VERSION#v}" sh linux/scripts/publish.sh
      - uses: actions/upload-artifact@v7
        with:
          name: AgentSpeed-Linux
          path: dist/AgentSpeed-Linux-x64.deb
          if-no-files-found: error

  publish:
    name: Publish release
    needs: [spec, macos, windows, linux]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v5
      - uses: actions/download-artifact@v8
        with:
          path: dist
          merge-multiple: true
      - name: Checksums
        working-directory: dist
        run: sha256sum AgentSpeed-* > SHA256SUMS.txt && cat SHA256SUMS.txt
      - name: Upload release assets
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          existing="$(gh release view "$GITHUB_REF_NAME" --json isDraft --jq .isDraft 2>/dev/null || true)"
          if [ "$existing" = "true" ]; then
            gh release upload "$GITHUB_REF_NAME" dist/* --clobber
            echo "Assets uploaded to the existing draft; publication remains manual."
            exit 0
          elif [ "$existing" = "false" ]; then
            echo "Release is already published; leaving its assets unchanged."
            exit 0
          fi
          : > notes.md
          if [ -f "docs/releases/${GITHUB_REF_NAME}.md" ]; then
            cat "docs/releases/${GITHUB_REF_NAME}.md" >> notes.md
          fi
          sed "s/{{VERSION}}/${GITHUB_REF_NAME}/g" .github/release-notes.md >> notes.md
          flags=""
          case "$GITHUB_REF_NAME" in *-*) flags="--prerelease" ;; esac
          gh release create "$GITHUB_REF_NAME" dist/* --title "Agent Speed ${GITHUB_REF_NAME}" --notes-file notes.md --verify-tag $flags
