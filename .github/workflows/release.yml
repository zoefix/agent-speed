name: Release

on:
  push:
    tags: ['v*']

permissions:
  contents: read

jobs:
  spec:
    name: Release contracts
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Check version and contracts
        run: |
          test "$(cat VERSION)" = "${GITHUB_REF_NAME#v}"
          python3 spec/tools/report_reference.py
          python3 spec/tools/execution_modes_reference.py
          python3 spec/tools/test_reporting_extensions.py
          python3 spec/tools/lan_reference.py --check-fixtures

  relay:
    name: Remote relay (${{ matrix.arch }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: x86_64
            runner: ubuntu-24.04
          - arch: aarch64
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v5
      - name: Build static relay
        run: linux/relay/build-static.sh ${{ matrix.arch }}
      - uses: actions/upload-artifact@v7
        with:
          name: relay-${{ matrix.arch }}
          path: linux/relay/dist/agent-speed-relay-linux-${{ matrix.arch }}
          if-no-files-found: error

  macos:
    name: macOS
    needs: relay
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v5
      # The tests read the embedded relays as the app bundle does.
      - uses: actions/download-artifact@v7
        with:
          pattern: relay-*
          path: linux/relay/dist
          merge-multiple: true
      - name: Select newest Xcode
        run: |
          xcode="$(ls -d /Applications/Xcode*.app | grep -viE 'beta|_rc|release_candidate' | sort -V | tail -1)"
          sudo xcode-select -s "$xcode"
          echo "::notice::$(xcodebuild -version | tr '\n' ' ')"
      - name: Test core
        working-directory: macos
        run: |
          # As in ci.yml: the suites with network round trips run after the rest, on their own.
          network='HTTPFetcherTests|LanNetworkTests|Report(Discovery|DiscoveryFailure|EndToEnd|Invite|Profile|StreamEndToEnd)Tests'
          swift test --skip "$network" && swift test --filter "$network"
      - name: Test update relaunch
        timeout-minutes: 5
        run: python3 macos/scripts/test-update-relaunch.py
      - name: Build app bundle
        run: macos/scripts/build-app.sh --version "${GITHUB_REF_NAME#v}"
      - uses: actions/upload-artifact@v7
        with:
          name: AgentSpeed-macOS
          path: dist/AgentSpeed-macOS.zip
          if-no-files-found: error

  windows:
    name: Windows
    needs: relay
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v5
      # The tests read the embedded relays as the published app does.
      - uses: actions/download-artifact@v7
        with:
          pattern: relay-*
          path: linux/relay/dist
          merge-multiple: true
      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 10.0.x
      - name: Test core
        run: dotnet test windows/tests/AgentSpeed.Core.Tests -c Release
      - name: Test presentation
        run: dotnet test windows/tests/AgentSpeed.Presentation.Tests -c Release
      - name: Test traffic helper
        run: dotnet test windows/tests/AgentSpeed.TrafficHelper.Tests -c Release
      - name: Test status line helper
        run: dotnet test windows/tests/AgentSpeed.StatuslineHelper.Tests -c Release
      - name: Publish
        shell: pwsh
        run: ./windows/scripts/publish.ps1 -Version $env:GITHUB_REF_NAME.TrimStart('v')
      - uses: actions/upload-artifact@v7
        with:
          name: AgentSpeed-Windows
          path: dist/AgentSpeed-Windows-*.zip
          if-no-files-found: error

  publish:
    name: Publish release
    needs: [spec, macos, windows]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v5
      - uses: actions/download-artifact@v8
        with:
          pattern: AgentSpeed-*
          path: dist
          merge-multiple: true
      - name: Checksums
        working-directory: dist
        run: sha256sum AgentSpeed-* > SHA256SUMS.txt && cat SHA256SUMS.txt
      - name: Upload release assets
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          existing="$(gh release view "$GITHUB_REF_NAME" --json isDraft --jq .isDraft 2>/dev/null || true)"
          if [ "$existing" = "true" ]; then
            gh release upload "$GITHUB_REF_NAME" dist/* --clobber
            echo "Assets uploaded to the existing draft; publication remains manual."
            exit 0
          elif [ "$existing" = "false" ]; then
            echo "Release is already published; leaving its assets unchanged."
            exit 0
          fi
          : > notes.md
          if [ -f "docs/releases/${GITHUB_REF_NAME}.md" ]; then
            cat "docs/releases/${GITHUB_REF_NAME}.md" >> notes.md
          fi
          sed "s/{{VERSION}}/${GITHUB_REF_NAME}/g" .github/release-notes.md >> notes.md
          flags=""
          case "$GITHUB_REF_NAME" in *-*) flags="--prerelease" ;; esac
          gh release create "$GITHUB_REF_NAME" dist/* --title "Agent Speed ${GITHUB_REF_NAME}" --notes-file notes.md --verify-tag $flags
