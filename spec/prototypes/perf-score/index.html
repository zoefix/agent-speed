<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Performance Score Prototype</title>
<style>
/* Performance score (性能) prototype: the visual reference of DESIGN §12 and every surface that shows 性能. */
:root {
  --ui: -apple-system, BlinkMacSystemFont, "SF Pro Text", "Segoe UI Variable Text", "Segoe UI", "PingFang TC",
        "Microsoft JhengHei UI", system-ui, sans-serif;
  --disp: "SF Pro Display", -apple-system, BlinkMacSystemFont, "Segoe UI Variable Display", "Segoe UI", "PingFang TC",
        system-ui, sans-serif;
  --mono: "SF Mono", ui-monospace, "Cascadia Mono", Consolas, monospace;
  --spring: cubic-bezier(.2, .8, .2, 1);
}
html[lang="zh-Hans"] { --ui: -apple-system, BlinkMacSystemFont, "SF Pro Text", "Segoe UI Variable Text", "Segoe UI", "PingFang SC", "Microsoft YaHei UI", system-ui, sans-serif; }
html[lang="ja"] { --ui: -apple-system, BlinkMacSystemFont, "SF Pro Text", "Segoe UI Variable Text", "Segoe UI", "Hiragino Sans", "Yu Gothic UI", system-ui, sans-serif; }

* { box-sizing: border-box; }
html, body { margin: 0; }
body { font-family: var(--ui); background: #0c0d11; color: #e9eaf0; -webkit-font-smoothing: antialiased; }
button { font: inherit; }
.tnum { font-variant-numeric: tabular-nums; }

/* ── Themes ───────────────────────────────────────────────────────────────────────────── */
[data-theme="dark"] {
  color-scheme: dark;
  --desk: #121318;
  --ink: rgba(255,255,255,.92); --ink-2: rgba(235,235,245,.64); --ink-3: rgba(235,235,245,.36);
  --cap: rgba(235,235,245,.56);
  --line: rgba(255,255,255,.09); --line-2: rgba(255,255,255,.14);
  --fill: rgba(255,255,255,.055); --fill-2: rgba(255,255,255,.1);
  --panel: #2b2b2e; --panel-line: rgba(255,255,255,.1);
  --card-bg: rgba(38,38,42,.9); --card-line: rgba(255,255,255,.12);
  --card-shadow: 0 22px 56px rgba(0,0,0,.55), 0 2px 10px rgba(0,0,0,.35);
  --score: #93A4D6; --track: rgba(255,255,255,.09);
  --pearl-a: #C7D2FE; --pearl-b: #F5D0FE; --pearl-c: #A5F3FC;
  --mint-ink: #6EE7B7; --mint-bg: rgba(52,211,153,.14);
  --amber: #F5A524;
  --win: #1e1e20; --win-card: rgba(255,255,255,.045); --win-bar: #2a2a2d; --row-2: rgba(255,255,255,.03); --sel: rgba(120,140,200,.2);
  --orb-g1: #1b1e29; --orb-g2: #08090d; --orb-rim: rgba(255,255,255,.14); --led-off: rgba(150,170,210,.13);
  --orb-num: rgba(255,255,255,.78); --orb-unit: rgba(255,255,255,.5); --orb-value: #fff;
  --bar-bg: rgba(28,28,30,.72); --bar-ink: rgba(255,255,255,.92); --bar-ink-2: rgba(255,255,255,.55);
  --tb-bg: rgba(32,32,32,.86); --tb-ink: #fff; --tb-ink-2: rgba(255,255,255,.62);
  --board-bg: rgba(16,18,28,.58); --board-line: rgba(255,255,255,.16);
  --b-ink: rgba(244,246,252,.96); --b-ink-2: rgba(232,236,245,.66); --b-ink-3: rgba(226,230,242,.38); --b-line-2: rgba(255,255,255,.14);
  --led: #EAF2FF; --mind: #CFE0FF; --unlit: rgba(140,170,255,.16); --ghost: rgba(160,190,255,.075); --n-ink-3: rgba(214,224,255,.36);
  --slab-2: #12151D; --block: #1B1F2A; --block-ink: #E8ECF5; --t-ink: #F5F7FB; --t-line: rgba(255,255,255,.1);
  --focus: #8fb2ff;
}
[data-theme="light"] {
  color-scheme: light;
  --desk: #e6e8ee;
  --ink: rgba(0,0,0,.86); --ink-2: rgba(60,60,67,.76); --ink-3: rgba(60,60,67,.42);
  --cap: rgba(60,60,67,.72);
  --line: rgba(0,0,0,.08); --line-2: rgba(0,0,0,.12);
  --fill: rgba(0,0,0,.04); --fill-2: rgba(0,0,0,.075);
  --panel: #f0f0f2; --panel-line: rgba(0,0,0,.09);
  --card-bg: rgba(251,251,253,.93); --card-line: rgba(0,0,0,.09);
  --card-shadow: 0 22px 50px rgba(24,28,44,.2), 0 2px 8px rgba(24,28,44,.1);
  --score: #4B5FA6; --track: rgba(0,0,0,.07);
  --pearl-a: #6D7CF0; --pearl-b: #C05BD9; --pearl-c: #1AA3C4;
  --mint-ink: #047857; --mint-bg: rgba(16,185,129,.12);
  --amber: #B86E00;
  --win: #f5f5f7; --win-card: rgba(0,0,0,.035); --win-bar: #ececee; --row-2: rgba(0,0,0,.025); --sel: rgba(60,90,180,.12);
  --orb-g1: #ffffff; --orb-g2: #dfe3ec; --orb-rim: rgba(0,0,0,.1); --led-off: rgba(40,50,90,.12);
  --orb-num: rgba(11,13,18,.76); --orb-unit: rgba(0,0,0,.5); --orb-value: #0b0d12;
  --bar-bg: rgba(246,246,248,.78); --bar-ink: rgba(0,0,0,.86); --bar-ink-2: rgba(0,0,0,.5);
  --tb-bg: rgba(243,243,243,.9); --tb-ink: #000; --tb-ink-2: rgba(0,0,0,.6);
  --board-bg: rgba(255,255,255,.56); --board-line: rgba(0,0,0,.08);
  --b-ink: rgba(17,20,30,.94); --b-ink-2: rgba(30,36,52,.66); --b-ink-3: rgba(30,36,52,.40); --b-line-2: rgba(0,0,0,.11);
  --led: #141A33; --mind: #3D4F9A; --unlit: rgba(20,30,80,.14); --ghost: rgba(20,30,80,.06); --n-ink-3: rgba(10,13,24,.40);
  --slab-2: #F1F3F7; --block: #E6E9F0; --block-ink: #1A1E28; --t-ink: #0E1118; --t-line: rgba(0,0,0,.1);
  --focus: #2f5bd8;
}
[data-theme] { color: var(--ink); }
/* Increase Contrast preview (DESIGN §12 Colors). */
.hc [data-theme] { --ink-3: var(--ink-2); --cap: var(--ink-2); --track: color-mix(in srgb, var(--ink) 25%, transparent);
  --pearl-a: var(--ink); --pearl-b: var(--ink); --pearl-c: var(--ink); --score: var(--ink); --b-ink-3: var(--b-ink-2); }

/* ── Page chrome ──────────────────────────────────────────────────────────────────────── */
.pg-top { position: sticky; top: 0; z-index: 50; display: flex; flex-wrap: wrap; align-items: center; gap: 10px 16px;
  padding: 12px 24px; background: rgba(12,13,17,.8); border-bottom: 1px solid rgba(255,255,255,.08);
  backdrop-filter: blur(18px) saturate(150%); -webkit-backdrop-filter: blur(18px) saturate(150%); }
.pg-top h1 { margin: 0; font-size: 13.5px; font-weight: 650; letter-spacing: .01em; }
.pg-top h1 small { display: block; margin-top: 2px; font-size: 11px; font-weight: 500; color: rgba(235,235,245,.5); }
.pg-top .spacer { flex: 1; }
.seg { display: inline-flex; gap: 1px; padding: 2px; border-radius: 9px; background: rgba(255,255,255,.06); }
.seg button, .pg-btn { color: rgba(235,235,245,.72); background: none; border: 0; padding: 5px 10px; border-radius: 7px;
  font-size: 12.5px; cursor: pointer; transition: background .15s, color .15s; white-space: nowrap; }
.seg button:hover, .pg-btn:hover { color: #fff; }
.seg button[aria-pressed="true"] { background: rgba(255,255,255,.14); color: #fff; }
.pg-btn { border: 1px solid rgba(255,255,255,.12); }
.pg-check { display: inline-flex; align-items: center; gap: 6px; font-size: 12.5px; color: rgba(235,235,245,.75); cursor: pointer; }
.pg-top :focus-visible { outline: 2px solid #8fb2ff; outline-offset: 1px; }
main { padding: 8px 24px 72px; }
.sec { margin: 36px auto 0; max-width: 1400px; }
.sec-head { display: flex; align-items: baseline; gap: 14px; margin: 0 4px 12px; flex-wrap: wrap; }
.sec-head h2 { margin: 0; white-space: nowrap; font-size: 17px; font-weight: 650; letter-spacing: .01em; color: #f2f3f8; }
.sec-head p { margin: 0; font-size: 12.5px; line-height: 1.5; color: rgba(235,235,245,.55); max-width: 940px; }
.pair { display: grid; grid-template-columns: repeat(var(--cols, 2), minmax(0, 1fr)); gap: 16px; }
.pair.one { --cols: 1; }
body[data-view="dark"] .pair, body[data-view="light"] .pair { --cols: 1; }
body[data-view="dark"] .theme-col[data-theme="light"], body[data-view="light"] .theme-col[data-theme="dark"] { display: none; }
.theme-col { position: relative; border-radius: 18px; padding: 22px; background: var(--desk); overflow: hidden; min-width: 0; isolation: isolate; }
.theme-col > .col-tag { position: absolute; top: 10px; right: 14px; font-size: 10.5px; font-weight: 600; letter-spacing: .08em;
  text-transform: uppercase; color: var(--ink-3); }
.wall { position: absolute; inset: 0; z-index: -1; pointer-events: none; }
[data-theme="dark"] .wall { background: radial-gradient(700px 420px at 12% 18%, rgba(88,58,170,.30), transparent 62%),
  radial-gradient(640px 400px at 88% 80%, rgba(18,120,140,.24), transparent 60%), var(--desk); }
[data-theme="light"] .wall { background: radial-gradient(700px 420px at 12% 18%, rgba(160,140,255,.26), transparent 62%),
  radial-gradient(640px 400px at 88% 80%, rgba(90,200,220,.22), transparent 60%), var(--desk); }
.tag { font-size: 10.5px; font-weight: 650; letter-spacing: .07em; text-transform: uppercase; color: var(--ink-2); margin: 0 0 8px 2px; }
.caption { font-size: 11.5px; color: var(--ink-2); text-align: center; margin-top: 8px; line-height: 1.4; }
.caption b { color: var(--ink); font-weight: 600; }
.vo { margin-top: 4px; font-size: 10.5px; line-height: 1.4; color: var(--cap); text-align: center; max-width: 100%; }
.stack { display: flex; flex-wrap: wrap; gap: 20px 18px; align-items: flex-start; }

/* ── Provisional mark: dotted = not settled yet ─────────────────────────────────────── */
/* Dot d = max(1px, 0.1 × size), pitch 2.4 d, centred 0.22 × size under the baseline, the number's color at 70 %. */
.pm { position: relative; display: inline-block; line-height: 1; }
.pm::after { content: ""; position: absolute; left: 0; right: 0; --d: max(1px, .1em); top: calc(1.075em - var(--d) / 2);
  height: var(--d); pointer-events: none; background: color-mix(in srgb, currentColor 70%, transparent);
  -webkit-mask: radial-gradient(circle closest-side, #000 92%, transparent 100%) 0 0 / calc(var(--d) * 2.4) var(--d) space no-repeat;
          mask: radial-gradient(circle closest-side, #000 92%, transparent 100%) 0 0 / calc(var(--d) * 2.4) var(--d) space no-repeat; }
.hc .pm::after { background: currentColor; --d: calc(max(1px, .1em) + .5px); }

/* ── Orb (led, the readout's reference style) ─────────────────────────────────────────── */
.orb { position: relative; width: var(--S); height: var(--S); flex: none; }
.orb svg { position: absolute; inset: 0; width: 100%; height: 100%; overflow: visible; }
.orb .ln { position: absolute; left: 0; right: 0; text-align: center; line-height: 1; white-space: nowrap; }
.orb .ln-perf { font-size: var(--p); }
.orb .ln-think { font-size: var(--t); }
.orb .glyph { font-size: .82em; font-weight: 600; color: var(--orb-unit); }
.orb .ln-perf .glyph { margin-right: .2em; }
.orb .ln-think .glyph { margin-right: .16em; }
.orb .n { font-weight: 600; font-variant-numeric: tabular-nums; color: var(--orb-num); }
.orb .is-pale .n, .orb .n.is-none { color: var(--orb-unit); }
.orb .u { font-size: .82em; font-weight: 500; color: var(--orb-unit); margin-left: .16em; }
.orb .val { font-family: var(--disp); font-weight: 700; color: var(--orb-value); font-variant-numeric: tabular-nums; letter-spacing: -.02em; }
.orb .unit { font-weight: 500; color: var(--orb-unit); }
.orb .ttl { font-weight: 650; letter-spacing: .04em; }
.orb-tile { display: flex; flex-direction: column; align-items: center; width: 112px; }
.orb-tile.hero { width: auto; }
.hover-tip { display: inline-block; font-size: 12px; line-height: 1.45; padding: 7px 10px; border-radius: 6px;
  background: var(--card-bg); border: 1px solid var(--card-line); box-shadow: var(--card-shadow); color: var(--ink); }
.hover-tip .sub { color: var(--ink-2); font-size: 11px; }

/* ── Menu bar and taskbar ─────────────────────────────────────────────────────────────── */
.mbar { display: flex; align-items: center; justify-content: flex-end; gap: 14px; height: 24px; padding: 0 12px;
  border-radius: 8px; background: var(--bar-bg); color: var(--bar-ink); font-size: 13px;
  backdrop-filter: blur(20px) saturate(160%); -webkit-backdrop-filter: blur(20px) saturate(160%); box-shadow: inset 0 0 0 .5px var(--line); }
.mbar .sys { color: var(--bar-ink); opacity: .9; font-size: 13px; font-weight: 500; display: inline-flex; }
.item { display: inline-flex; align-items: center; height: 22px; padding: 0 6px; border-radius: 5px; }
.item .v { font-size: 13px; font-weight: 500; font-variant-numeric: tabular-nums; margin-left: 4.5px; }
.item .v.is-idle { color: var(--bar-ink-2); }
.item .unit { font-size: 10px; color: var(--bar-ink-2); margin-left: 3px; }
.rblock { display: grid; grid-template-columns: max-content max-content max-content; margin-left: 8px;
  font-size: 9px; font-weight: 500; line-height: 10px; font-variant-numeric: tabular-nums; position: relative; }
.rblock .row { display: contents; }
.rblock .lb { grid-column: 1; color: var(--bar-ink-2); padding-right: 3px; }
.rblock .nb { grid-column: 2; text-align: right; color: color-mix(in srgb, var(--bar-ink) 85%, transparent); }
.rblock .ub { grid-column: 3; color: var(--bar-ink-2); padding-left: 2.5px; }
.rblock .pm::after { top: calc(1.025em - var(--d) / 2); }
.rblock .ghost { visibility: hidden; height: 0; overflow: hidden; line-height: 0; }
.rblock.is-pale .r1 .nb, .rblock .nb.is-quiet { color: var(--bar-ink-2); }
.rblock.single .r1 > * { transform: translateY(5px); }
.rblock.single .r2 > * { visibility: hidden; }
.tbar { display: flex; align-items: center; justify-content: flex-end; gap: 14px; height: 48px; padding: 0 12px;
  border-radius: 10px; background: var(--tb-bg); color: var(--tb-ink); font-family: "Segoe UI Variable Text", "Segoe UI", var(--ui);
  box-shadow: inset 0 1px 0 var(--line-2); }
.tbar .item .v { font-size: 15px; font-weight: 600; }
.tbar .item .unit { font-size: 11px; color: var(--tb-ink-2); }
.tbar .rblock { font-size: 10px; line-height: 11px; }
.tbar .rblock .lb, .tbar .rblock .ub { color: var(--tb-ink-2); }
.tbar .rblock .ub { padding-left: 3px; }
.tbar .rblock .nb { color: color-mix(in srgb, var(--tb-ink) 85%, transparent); }
.tbar .rblock.is-pale .r1 .nb, .tbar .rblock .nb.is-quiet { color: var(--tb-ink-2); }
.tbar .rblock.single .r1 > * { transform: translateY(5.5px); }
.tbar .clock { text-align: right; font-size: 11.5px; line-height: 15px; }
.tbar .tray { display: flex; gap: 12px; opacity: .85; }
.bar-states { display: grid; grid-template-columns: repeat(auto-fill, minmax(196px, 1fr)); gap: 14px 14px; margin-top: 14px; }
.bar-state { display: flex; flex-direction: column; align-items: center; gap: 6px; min-width: 0; }
.bar-state .mbar, .bar-state .tbar { justify-content: center; width: 100%; padding: 0 6px; }
.bar-state .tbar { height: 44px; }
.bar-label { font-size: 11px; font-weight: 600; color: var(--ink-2); }

/* ── Board (glass M) ──────────────────────────────────────────────────────────────────── */
.board-wrap { display: flex; align-items: flex-start; gap: 14px; flex-wrap: wrap; }
.board { position: relative; width: 340px; height: 340px; border-radius: 30px; flex: none; color: var(--b-ink);
  background: var(--board-bg); border: 1px solid var(--board-line);
  backdrop-filter: blur(26px) saturate(170%); -webkit-backdrop-filter: blur(26px) saturate(170%);
  box-shadow: 0 0 0 .5px rgba(255,255,255,.06) inset, 0 1px 0 rgba(255,255,255,.18) inset, 0 24px 60px rgba(0,0,0,.35); }
[data-theme="light"] .board { box-shadow: 0 1px 0 rgba(255,255,255,.9) inset, 0 20px 50px rgba(30,40,80,.18); }
.board .hero { position: absolute; left: 16px; right: 16px; top: 14px; height: 86px; display: flex; gap: 8px; }
.board .hero-l { flex: 1; min-width: 0; display: flex; flex-direction: column; justify-content: center; }
.board .hero-v { font-family: var(--disp); font-size: 44px; font-weight: 700; letter-spacing: -.03em; line-height: 1; font-variant-numeric: tabular-nums; }
.board .hero-v small { font-family: var(--ui); font-size: 12px; font-weight: 600; letter-spacing: 0; color: var(--b-ink-3); margin-left: 4px; }
.board .hero-t { margin-top: 6px; font-size: 12.5px; font-weight: 650; letter-spacing: .03em; }
.board .hero-c { margin-top: 3px; font-size: 10.5px; color: var(--b-ink-3); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.board .strip { position: absolute; left: 16px; right: 16px; top: 100px; height: 16px; }
.board .rank { position: absolute; left: 16px; right: 16px; top: 120px; }
.board .caps { display: flex; align-items: center; height: 12px; font-size: 9px; font-weight: 600; letter-spacing: .06em; color: var(--b-ink-3); margin-bottom: 2px; }
.board .caps .hair { flex: 1; height: 1px; background: var(--board-line); margin-right: 8px; }
.board .caps .ci { width: 39px; text-align: right; }
.board .caps .cv { width: 48px; text-align: right; margin-left: 8px; }
.brow { position: relative; display: flex; align-items: center; height: 38px; gap: 8px; border-radius: 8px; padding: 0 2px; cursor: default; outline: none; }
.brow:hover, .brow:focus-visible, .brow.is-open { background: var(--fill); }
.brow:focus-visible { box-shadow: 0 0 0 2px var(--focus); }
.brow .rk { width: 16px; text-align: center; font-size: 11px; font-weight: 700; color: var(--b-ink-2); font-variant-numeric: tabular-nums; align-self: flex-start; margin-top: 7px; }
.brow .bd { width: 8px; height: 8px; border-radius: 50%; flex: none; align-self: flex-start; margin-top: 9px; }
.brow .nm { flex: 1; min-width: 0; display: flex; flex-direction: column; gap: 3px; }
.brow .nm .l1 { display: flex; align-items: center; gap: 6px; min-width: 0; }
.brow .nm b { font-size: 12.5px; font-weight: 650; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; min-width: 0; }
.brow .nm i { font-style: normal; font-size: 10.5px; color: var(--b-ink-3); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.brow .pf { width: 39px; flex: none; text-align: right; font-size: 13px; font-weight: 600; color: var(--b-ink-2); font-variant-numeric: tabular-nums; }
.brow .pf.is-pale { color: var(--b-ink-3); font-weight: 500; }
.brow .bv { width: 48px; flex: none; text-align: right; font-size: 14.5px; font-weight: 650; font-variant-numeric: tabular-nums; }
.brow .bv.is-quiet { color: var(--b-ink-3); font-weight: 500; }
.brow .share { position: absolute; left: 34px; bottom: 0; height: 1.5px; border-radius: 1px; opacity: .75; box-shadow: 0 0 6px currentColor; background: currentColor; }
.board .more { height: 16px; display: flex; align-items: center; padding-left: 26px; font-size: 10.5px; color: var(--b-ink-3); font-variant-numeric: tabular-nums; }
.board .foot { position: absolute; left: 16px; right: 16px; bottom: 13px; display: flex; justify-content: space-between;
  font-size: 10.5px; color: var(--b-ink-3); font-variant-numeric: tabular-nums; }
.board .foot b { color: var(--b-ink-2); font-weight: 600; }
.capsule { display: inline-flex; align-items: center; gap: 4px; height: 16px; padding: 0 5px; border-radius: 9px; flex: none;
  background: var(--fill); box-shadow: inset 0 0 0 .5px var(--line-2); }
.capsule .meter { display: inline-flex; align-items: flex-end; gap: 1.5px; height: 8px; }
.capsule .meter i { width: 2.5px; border-radius: .75px; background: var(--ink-3); opacity: .55; }
.capsule .meter i.on { background: var(--ink-2); opacity: 1; }
.capsule .w { font-size: 9.5px; font-weight: 500; color: var(--ink-2); }
.capsule .bolt { color: var(--amber); display: inline-flex; }
.dash .capsule { height: 18px; padding: 0 6px; gap: 5px; }
.dash .capsule .w { font-size: 11px; }
.dash .capsule .meter { height: 10px; }

/* Glass sub-gauge (光環副錶), M. Vertical numbers from the sub-gauge's top (DESIGN 2c). */
.sg { position: relative; width: 112px; height: 84px; flex: none; align-self: center; border-radius: 10px; cursor: default; outline: none; color: var(--b-ink); }
.sg:focus-visible { box-shadow: 0 0 0 2px var(--focus); }
.sg svg { position: absolute; left: 23px; top: 0; width: 66px; height: 49px; overflow: visible; }
.sg .lab { position: absolute; left: 0; right: 0; top: 14.8px; text-align: center; font-size: 8.5px; line-height: 1; font-weight: 600; letter-spacing: .1em; color: var(--b-ink-3); }
.sg .num { position: absolute; left: 0; right: 0; top: 28.2px; text-align: center; font-family: var(--disp); font-size: 17px; line-height: 1;
  font-weight: 650; letter-spacing: -.02em; font-variant-numeric: tabular-nums; color: var(--b-ink); }
.sg .num.is-pale { color: var(--b-ink-3); }
.sg .tbl { position: absolute; left: 0; right: 0; top: 52px; display: grid; justify-content: center;
  grid-template-columns: max-content 7px max-content max-content; row-gap: 2px; font-size: 11px; line-height: 15px; }
.sg .tbl .l { font-size: 8.5px; font-weight: 600; letter-spacing: .04em; color: var(--b-ink-3); padding-right: 4px; align-self: center; }
.sg .tbl .n { font-weight: 600; text-align: right; font-variant-numeric: tabular-nums; min-width: 34px; }

/* ── Dashboard panel ──────────────────────────────────────────────────────────────────── */
.dash-wrap { display: flex; align-items: flex-start; gap: 8px; justify-content: center; flex-wrap: wrap; }
.card-slot { position: relative; width: 320px; flex: none; min-height: 120px; }

  font-size: 12px; color: var(--ink-3); border: 1px dashed var(--line-2); }

.dots3 { display: inline-flex; gap: 2px; }

@keyframes shimmer { 0%, 100% { opacity: .35; } 45% { opacity: 1; } }
.static .dots3 i, .reduce .dots3 i { animation: none; opacity: .8; }
.idle-dot { width: 6px; height: 6px; border-radius: 50%; background: var(--ink-3); }

/* ── Score card (性能分析卡) ─────────────────────────────────────────────────────────── */
.card { width: 320px; border-radius: 12px; padding: 14px; background: var(--card-bg); color: var(--ink);
  border: .5px solid var(--card-line); box-shadow: var(--card-shadow); text-align: left;
  backdrop-filter: blur(30px) saturate(180%); -webkit-backdrop-filter: blur(30px) saturate(180%); }

@keyframes fade-in { from { opacity: 0; } to { opacity: 1; } }
.c-head { display: flex; align-items: center; gap: 7px; min-width: 0; }
.c-head .dot { width: 7px; height: 7px; border-radius: 50%; flex: none; }

.c-meta { margin: 3px 0 0 14px; font-size: 11px; color: var(--ink-2); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.chip { display: inline-flex; align-items: center; gap: 4px; height: 18px; padding: 0 7px; border-radius: 9px; flex: none;
  font-size: 11px; font-weight: 600; letter-spacing: .01em; white-space: nowrap; font-variant-numeric: tabular-nums; }
.chip svg { flex: none; }
.chip-up { color: var(--mint-ink); background: var(--mint-bg); }

.chip-dot { color: var(--ink-2); position: relative; padding-left: 6px; }
.chip-dot::before { content: ""; position: absolute; inset: 0; border-radius: inherit; border: 1px dotted color-mix(in srgb, var(--ink) 35%, transparent); }
.hc .chip { box-shadow: inset 0 0 0 1px currentColor; }
.c-score { margin-top: 12px; padding-top: 12px; border-top: .5px solid var(--line); }
.c-eyebrow { font-size: 11px; color: var(--ink-2); margin-bottom: 3px; }
.c-top { display: flex; align-items: center; justify-content: space-between; gap: 10px; }
.c-big { font-family: var(--disp); font-size: 34px; line-height: 1; font-weight: 600; letter-spacing: -.02em; font-variant-numeric: tabular-nums; }
.c-big.is-pale { color: var(--ink-2); }
.c-big.is-none { color: var(--ink-3); font-weight: 500; }
.c-big.pm::after { top: calc(1.04em - var(--d) / 2); }
/* The log scale: gradient laid across the whole track, revealed up to f. */
.scale { position: relative; margin-top: 10px; height: 6px; }
.scale .trk { position: absolute; inset: 0; border-radius: 3px; background: var(--track); }
.scale .fill { position: absolute; inset: 0; border-radius: 3px;
  background: linear-gradient(90deg, var(--pearl-c), var(--pearl-a) 50%, var(--pearl-b));
  clip-path: inset(0 calc(100% - var(--f, 0) * 100%) 0 0 round 3px); }
.scale.is-pale .fill { opacity: .45; }
.scale.is-prov .fill { -webkit-mask: radial-gradient(circle closest-side, #000 94%, transparent 100%) 0 50% / 13.2px 6px repeat-x;
  mask: radial-gradient(circle closest-side, #000 94%, transparent 100%) 0 50% / 13.2px 6px repeat-x; }
.scale .tk { position: absolute; top: -2px; width: 1px; height: 10px; margin-left: -.5px; background: color-mix(in srgb, var(--ink) 18%, transparent); }
.scale .tk.ref { top: -4px; height: 14px; background: color-mix(in srgb, var(--ink) 45%, transparent); }
.scale-lab { position: relative; height: 11px; margin-top: 4px; font-size: 9.5px; line-height: 11px; color: var(--ink-3); font-variant-numeric: tabular-nums; }
.scale-lab span { position: absolute; transform: translateX(-50%); white-space: nowrap; }
.scale-lab span.ref { color: var(--ink-2); font-weight: 600; }
.scale-lab span.end { transform: translateX(-100%); }
.c-sum { margin-top: 8px; font-size: 12px; line-height: 1.42; color: var(--ink-2); }
.c-hint { margin-top: 4px; font-size: 11px; line-height: 1.4; color: var(--ink-3); }
.comps { display: grid; grid-template-columns: minmax(0, 1fr) minmax(64px, max-content) 10px 44px 8px minmax(34px, max-content);
  align-items: center; margin-top: 14px; }
.comps .g-t { grid-column: 1 / -1; font-size: 11px; font-weight: 650; letter-spacing: .06em; color: var(--ink-3); margin: 0 0 7px; }

.comps .g-t + .lb { margin-top: 0; }

.comps .lb { grid-column: 1; font-size: 12.5px; font-weight: 600; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; padding-right: 8px; }

.comps .mm { grid-column: 4; }

.comps .ds { grid-column: 1 / -1; margin: 3px 0 9px; font-size: 10.5px; line-height: 1.38; color: var(--cap); }
.comps .ds:last-child { margin-bottom: 0; }
.mm { position: relative; height: 4px; border-radius: 2px; background: var(--track); }
.mm i { position: absolute; left: 0; top: 0; bottom: 0; border-radius: 2px; background: var(--score); }
.mm b { position: absolute; left: 50%; top: -2px; width: 1px; height: 8px; margin-left: -.5px; background: color-mix(in srgb, var(--ink) 35%, transparent); }
.mm.dotted { background: radial-gradient(circle closest-side, color-mix(in srgb, var(--ink) 18%, transparent) 94%, transparent 100%) 0 50% / 8.8px 4px repeat-x; }
.mm.dotted b { display: none; }
.c-sigs { margin-top: 14px; }
.c-sigs .g-t { font-size: 11px; font-weight: 650; letter-spacing: .06em; color: var(--ink-3); margin-bottom: 7px; }
html[lang="en"] .c-sigs .g-t { text-transform: uppercase; font-size: 10.5px; }
.sig { display: flex; gap: 7px; align-items: flex-start; font-size: 12px; line-height: 1.4; color: var(--ink-2); margin-top: 6px; }

.sig svg { flex: none; margin-top: 2px; }

.c-facts { margin-top: 12px; padding-top: 9px; border-top: .5px solid var(--line); font-size: 11px; line-height: 1.5; color: var(--ink-2); }

.cards-grid { display: grid; grid-template-columns: repeat(auto-fill, 320px); gap: 18px 16px; justify-content: center; align-items: start; }
.cards-grid figure { margin: 0; }
.cards-grid figcaption { margin-bottom: 7px; font-size: 10.5px; font-weight: 650; letter-spacing: .07em; color: var(--ink-2); text-transform: uppercase; }

  border-bottom: .5px solid var(--line-2); font-size: 12.5px; white-space: nowrap; overflow: hidden; }

.pt-tip { position: absolute; pointer-events: none; padding: 7px 10px; border-radius: 8px; font-size: 11.5px; line-height: 1.45;
  background: var(--card-bg); border: .5px solid var(--card-line); box-shadow: var(--card-shadow); white-space: nowrap; font-variant-numeric: tabular-nums; }

.mcell { display: flex; align-items: center; gap: 7px; min-width: 0; max-width: 260px; }

.chip-sm { display: inline-flex; align-items: center; height: 16px; padding: 0 6px; font-size: 10px; font-weight: 600; border-radius: 8px; color: var(--ink-2); position: relative; flex: none; }

.col-parts, .plist { display: none; }
.pp-foot { margin-top: 12px; font-size: 11px; color: var(--cap); }
@container pp (max-width: 859px) {
  .col-comp { display: none; }
  .col-parts { display: table-cell; }
  .mcell { max-width: 220px; }
}
@container pp (max-width: 599px) {
  .ptbl { display: none; }
  .plist { display: block; margin-top: 10px; }
  .chart { height: 120px; }
  .trend-t .legend { margin-left: 0; }
}
.plist .pi { padding: 9px 8px; border-bottom: .5px solid var(--line); border-radius: 6px; cursor: default; }
.plist .pi.sel { background: var(--sel); }
.plist .l1 { display: flex; align-items: center; gap: 7px; font-size: 12.5px; }
.plist .l1 .id { font-weight: 600; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; min-width: 0; }
.plist .l1 .r { margin-left: auto; flex: none; }
.plist .l2, .plist .l3 { margin-top: 3px; font-size: 11px; line-height: 1.45; color: var(--ink-2); font-variant-numeric: tabular-nums; }
.plist .pi.low .l1 .id { color: var(--ink-2); font-weight: 500; }
.pp-state { display: flex; flex-direction: column; align-items: center; justify-content: center; text-align: center; gap: 6px; padding: 26px 12px 20px; }
.pp-state .gl { color: var(--ink-3); }
.pp-state b { font-size: 13px; font-weight: 600; color: var(--ink-2); }
.pp-state span { font-size: 11.5px; line-height: 1.45; color: var(--cap); max-width: 360px; }
.skel { display: grid; gap: 10px; margin-top: 14px; }
.skel i { display: block; height: 9px; border-radius: 4px; background: var(--fill-2); }
.hist-variants { display: grid; gap: 22px; }
.hist-row { display: flex; gap: 18px; flex-wrap: wrap; align-items: flex-start; }
.states-row { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 14px; }
.states-row .hwin .pp { margin-top: 0; }

/* ── Scale reference ─────────────────────────────────────────────────────────────────── */
.ruler { position: relative; height: 64px; margin: 8px 6px 0; }
.ruler .zone { position: absolute; top: 18px; height: 10px; border-radius: 3px; }
.ruler .zl { position: absolute; top: 0; font-size: 11px; font-weight: 600; color: var(--ink-2); transform: translateX(-50%); white-space: nowrap; }
.ruler .tick { position: absolute; top: 32px; font-size: 10px; color: var(--ink-3); transform: translateX(-50%); font-variant-numeric: tabular-nums; }
.ruler .tick.ref { color: var(--ink); font-weight: 650; }
.ruler .bar { position: absolute; top: 14px; width: 1px; height: 18px; background: color-mix(in srgb, var(--ink) 30%, transparent); }
.fmt { width: 100%; border-collapse: collapse; margin-top: 16px; font-size: 12px; font-variant-numeric: tabular-nums; }
.fmt th, .fmt td { padding: 6px 10px; text-align: right; border-bottom: .5px solid var(--line); }
.fmt th { font-size: 11px; font-weight: 600; color: var(--ink-2); }
.fmt td:first-child, .fmt th:first-child { text-align: left; color: var(--ink-2); }
.fmt td.c { font-family: var(--mono); }

@media (prefers-reduced-motion: reduce) { .dots3 i { animation: none; } }
@media (max-width: 760px) { main { padding: 8px 16px 48px; } .pg-top { padding: 10px 16px; } .theme-col { padding: 16px; } }

l","ja":"合計 %d 回のツール呼び出し"},"perf.comp.toolTime":{"zh-Hant":"工具耗時","zh-Hans":"工具耗时","en":"Tool time","ja":"ツール所要時間"},"perf.comp.toolTime.desc":{"zh-Hant":"工具從呼叫到傳回結果的典型時間","zh-Hans":"工具从调用到返回结果的典型时间","en":"Typical time from a tool call to its result","ja":"ツールを呼び出してから結果が返るまでの標準的な時間"},"perf.comp.toolSuccess":{"zh-Hant":"工具成功率","zh-Hans":"工具成功率","en":"Tool success","ja":"ツール成功率"},"perf.comp.toolSuccess.desc":{"zh-Hant":"沒有回報錯誤的工具呼叫比例","zh-Hans":"没有返回错误的工具调用比例","en":"Share of tool calls that returned without an error","ja":"エラーなく返ったツール呼び出しの割合"},"perf.comp.cache":{"zh-Hant":"快取命中","zh-Hans":"缓存命中","en":"Cache hits","ja":"キャッシュヒット"},"perf.comp.cache.desc":{"zh-Hant":"輸入 token 中從快取讀取的比例","zh-Hans":"输入 token 中从缓存读取的比例","en":"Share of input tokens read from the cache","ja":"入力 token のうちキャッシュから読んだ割合"},"perf.reason.notRecorded":{"zh-Hant":"不記錄","zh-Hans":"不记录","en":"Not recorded","ja":"記録なし"},"perf.reason.notRecorded.hint":{"zh-Hant":"%@ 不記錄這項資料，所以不計入分數，也不會扣分。","zh-Hans":"%@ 不记录这项数据，所以不计入分数，也不会扣分。","en":"%@ doesn't record this, so it is left out of the score rather than counted against it.","ja":"%@ はこの項目を記録しないため、スコアから除外され、減点もされません。"},"perf.reason.fewSamples":{"zh-Hant":"樣本不足","zh-Hans":"样本不足","en":"Too few","ja":"サンプル不足"},"perf.reason.fewSamples.hint":{"zh-Hant":"資料不到 %d 筆，暫不計入分數。","zh-Hans":"数据不到 %d 条，暂不计入分数。","en":"Fewer than %d values, so it is left out for now.","ja":"データが %d 件未満のため、いまは除外しています。"},"perf.unit.ms":{"zh-Hant":"%@ 毫秒","zh-Hans":"%@ 毫秒","en":"%@ ms","ja":"%@ ミリ秒"},"perf.unit.s":{"zh-Hant":"%@ 秒","zh-Hans":"%@ 秒","en":"%@ s","ja":"%@ 秒"},"perf.unit.min":{"zh-Hant":"%@ 分鐘","zh-Hans":"%@ 分钟","en":"%@ min","ja":"%@ 分"},"perf.unit.perMin":{"zh-Hant":"%@ 次/分","zh-Hans":"%@ 次/分","en":"%@/min","ja":"%@ 回/分"},"perf.card.sample":{"zh-Hant":"有效計時請求 %d 個 · 近 30 分鐘","zh-Hans":"有效计时请求 %d 个 · 近 30 分钟","en":"%d timed requests · last 30 minutes","ja":"計時できたリクエスト %d 件 · 直近 30 分"},"perf.card.footnote":{"zh-Hant":"1000 是參考水準，沒有上限；參考值依開發者的實際紀錄校準，不是業界標準。只有在即時上報分享模型、且服務支援時，才會傳送分數和各模型的性能統計，供排名使用。","zh-Hans":"1000 是参考水平，没有上限；参考值依开发者的实际记录校准，不是业界标准。只有在实时上报分享模型、且服务支持时，才会发送分数和各模型的性能统计，供排名使用。","en":"1000 is the reference level, with no upper limit; the reference values were calibrated on the developer's own logs, not an industry standard. The score and per-model performance statistics are sent, for ranking, only by live reporting with model sharing on, to a service that supports them.","ja":"1000 が基準で、上限はありません。基準値は開発者の実際のログで調整したもので、業界標準ではありません。スコアとモデルごとの性能統計をランキング用に送るのは、ライブ送信でモデルを共有し、サービスが対応している場合だけです。"},"perf.signals.title":{"zh-Hant":"行為","zh-Hans":"行为","en":"Behavior","ja":"挙動"},"perf.tooltip.top":{"zh-Hant":"性能 %@ · 最高：%@","zh-Hans":"性能 %@ · 最高：%@","en":"Perf %@ · top: %@","ja":"性能 %@ · 最高：%@"},"perf.tooltip.note":{"zh-Hant":"1000 為參考水準，沒有上限","zh-Hans":"1000 为参考水平，没有上限","en":"1000 is the reference level; no upper limit","ja":"1000 が基準、上限なし"},"a11y.perf.provisional":{"zh-Hant":"%@，初步（樣本少）","zh-Hans":"%@，初步（样本少）","en":"%@, provisional (few samples)","ja":"%@、暫定（サンプルが少ない）"},"a11y.perf.idle":{"zh-Hant":"%@，閒置中","zh-Hans":"%@，空闲中","en":"%@, idle","ja":"%@、待機中"},"a11y.perf.top":{"zh-Hant":"%@，%d 個 agent 中最高","zh-Hans":"%@，%d 个 agent 中最高","en":"%@, the highest of %d agents","ja":"%@、%d 個の agent で最高"},"a11y.perf.card":{"zh-Hant":"性能分析詳情","zh-Hans":"性能分析详情","en":"Performance details","ja":"性能の詳細"},"a11y.perf.score":{"zh-Hant":"性能 %@，%@","zh-Hans":"性能 %@，%@","en":"performance %@, %@","ja":"性能 %@、%@"},"a11y.perf.usual.up":{"zh-Hant":"比平常高 %@","zh-Hans":"比平常高 %@","en":"%@ above usual","ja":"普段より %@ 高い"},"a11y.perf.usual.down":{"zh-Hant":"比平常低 %@","zh-Hans":"比平常低 %@","en":"%@ below usual","ja":"普段より %@ 低い"},"a11y.perf.usual.same":{"zh-Hant":"和平常一樣","zh-Hans":"和平常一样","en":"same as usual","ja":"普段と同じ"},"a11y.perf.comp":{"zh-Hant":"%@：%@，分數 %@","zh-Hans":"%@：%@，分数 %@","en":"%@: %@, score %@","ja":"%@：%@、スコア %@"},"a11y.perf.comp.absent":{"zh-Hant":"%@：%@","zh-Hans":"%@：%@","en":"%@: %@","ja":"%@：%@"},"settings.bar.intelligence":{"zh-Hant":"顯示性能","zh-Hans":"显示性能","en":"Show Perf","ja":"性能を表示"},"settings.bar.intelligence.hint":{"zh-Hant":"在數值旁顯示所有 agent 中最高的性能分數（1000 為參考水準，沒有上限）與每秒思考 token 數；沒有分數時顯示「–」。","zh-Hans":"在数值旁显示所有 agent 中最高的性能分数（1000 为参考水平，没有上限）与每秒思考 token 数；没有分数时显示“–”。","en":"Shows the highest performance score among all agents (1000 is the reference level, with no upper limit) and their thinking tokens per second next to the value, and – when there is no score.","ja":"数値の横に、すべての agent のうち最も高い性能スコア（1000 が基準、上限なし）と毎秒の思考トークン数を表示します。スコアがないときは「–」です。"},"privacy.perfScore":{"zh-Hant":"性能分數：Agent Speed 依回應的時間與 token 數，以及工具呼叫的開始與結束時間、是否出錯，計算每個 agent 的性能分數；用量歷史只保存各模型每天的彙總數字。只有在你開啟即時上報並保留模型分享、且服務支援時，才會把目前的分數和各模型的性能統計（輸出與耗時總和、首段延遲分布、思考、快取、工具呼叫的次數、耗時與失敗數、活躍時間）傳送給該服務，供排名與統計分析；從不傳送單一請求或工具呼叫的資料，也不含提示詞、指令、路徑或時間點。","zh-Hans":"性能分数：Agent Speed 依响应的时间与 token 数，以及工具调用的开始与结束时间、是否出错，计算每个 agent 的性能分数；用量历史只保存各模型每天的汇总数字。只有在你开启实时上报并保留模型分享、且服务支持时，才会把当前的分数和各模型的性能统计（输出与耗时总和、首段延迟分布、思考、缓存、工具调用的次数、耗时与失败数、活跃时间）发送给该服务，供排名与统计分析；从不发送单个请求或工具调用的数据，也不含提示词、命令、路径或时间点。","en":"Performance score: Agent Speed computes each agent's performance score from the timing and token counts of its responses and from when its tool calls start and finish and whether they fail; the usage history keeps only per-model daily totals of these figures. Only live reporting sends anything of it, when you turn it on, leave model sharing on and the service supports it: the current score and per-model performance statistics (sums of output and duration, the first-content latency distribution, thinking, cache, tool-call counts, time and failures, active time), for ranking and statistical analysis. It never sends anything about a single request or tool call, and no prompts, commands, paths or timestamps.","ja":"性能スコア：Agent Speed は、応答の時間と token 数、ツール呼び出しの開始・終了の時刻とエラーの有無から各 agent の性能スコアを計算し、使用履歴にはモデルごとの日別の合計だけを保存します。送信するのは、ライブ送信をオンにしてモデルの共有もオンのままにし、サービスが対応している場合だけで、内容は現在のスコアとモデルごとの性能統計（出力量と所要時間の合計、最初の出力までの時間の分布、思考、キャッシュ、ツール呼び出しの回数・所要時間・失敗数、アクティブ時間）です。ランキングと統計分析に使われます。個々のリクエストやツール呼び出しのデータ、プロンプト、コマンド、パス、時刻は送信しません。"},"report.section.models":{"zh-Hant":"使用中的模型","zh-Hans":"使用中的模型","en":"Models in use","ja":"使用中のモデル"},"report.section.models.perfScore":{"zh-Hant":"也會傳送性能分數、思考速度，以及各模型的性能統計（輸出與耗時總和、首段延遲分布、思考、快取、工具呼叫的次數、耗時與失敗數、活躍時間），供排名與統計分析。只有每個模型的彙總數字，從不傳送單一請求或工具呼叫的資料，也不含提示詞、指令、路徑或時間點。","zh-Hans":"也会发送性能分数、思考速度，以及各模型的性能统计（输出与耗时总和、首段延迟分布、思考、缓存、工具调用的次数、耗时与失败数、活跃时间），供排名与统计分析。只有每个模型的汇总数字，从不发送单个请求或工具调用的数据，也不含提示词、命令、路径或时间点。","en":"Also sends the performance score, thinking speed and per-model performance statistics (sums of output and duration, the first-content latency distribution, thinking, cache, tool-call counts, time and failures, active time) for ranking and statistical analysis. Only per-model totals: never anything about a single request or tool call, and no prompts, commands, paths or timestamps.","ja":"性能スコア、思考の速度、モデルごとの性能統計（出力量と所要時間の合計、最初の出力までの時間の分布、思考、キャッシュ、ツール呼び出しの回数・所要時間・失敗数、アクティブ時間）も、ランキングと統計分析のために送信します。送るのはモデルごとの合計だけで、個々のリクエストやツール呼び出しのデータ、プロンプト、コマンド、パス、時刻は含みません。"},"source.zcode":{"zh-Hant":"ZCode","zh-Hans":"ZCode","en":"ZCode","ja":"ZCode"},"source.kimi":{"zh-Hant":"Kimi Code CLI","zh-Hans":"Kimi Code CLI","en":"Kimi Code CLI","ja":"Kimi Code CLI"},"source.grokBuild":{"zh-Hant":"Grok Build","zh-Hans":"Grok Build","en":"Grok Build","ja":"Grok Build"},"source.pi":{"zh-Hant":"Pi","zh-Hans":"Pi","en":"Pi","ja":"Pi"},"source.openclaw":{"zh-Hant":"OpenClaw","zh-Hans":"OpenClaw","en":"OpenClaw","ja":"OpenClaw"},"source.hermes":{"zh-Hant":"Hermes Agent","zh-Hans":"Hermes Agent","en":"Hermes Agent","ja":"Hermes Agent"},"source.droid":{"zh-Hant":"Factory Droid","zh-Hans":"Factory Droid","en":"Factory Droid","ja":"Factory Droid"},"effort.tooltip":{"zh-Hant":"推理強度：%@","zh-Hans":"推理强度：%@","en":"Reasoning effort: %@","ja":"推論の強さ：%@"},"speed.tooltip":{"zh-Hant":"加速：%@","zh-Hans":"加速：%@","en":"Speed: %@","ja":"高速化：%@"},"speed.value.standard":{"zh-Hant":"標準","zh-Hans":"标准","en":"Standard","ja":"標準"},"speed.value.fast":{"zh-Hant":"Fast","zh-Hans":"Fast","en":"Fast","ja":"Fast"},"speed.value.ultrafast":{"zh-Hant":"Ultrafast","zh-Hans":"Ultrafast","en":"Ultrafast","ja":"Ultrafast"},"speed.value.highspeed":{"zh-Hant":"Highspeed","zh-Hans":"Highspeed","en":"Highspeed","ja":"Highspeed"},"history.perf.title":{"zh-Hant":"性能表現","zh-Hans":"性能表现","en":"Performance","ja":"性能"},"history.perf.info":{"zh-Hant":"性能是 Agent Speed 依回應與工具紀錄算出的跑分：1000 是參考水準，沒有上限，越高越快。這裡把所選期間每個來源與模型的紀錄合併後計算，至少要有 20 個有效計時請求才有分數；每日趨勢只畫有 20 個以上的日子。參考值依開發者的實際紀錄校準，不是業界標準。","zh-Hans":"性能是 Agent Speed 依响应与工具记录算出的跑分：1000 是参考水平，没有上限，越高越快。这里把所选期间每个来源与模型的记录合并后计算，至少要有 20 个有效计时请求才有分数；每日趋势只画有 20 个以上的日子。参考值依开发者的实际记录校准，不是业界标准。","en":"Performance is a benchmark-style score Agent Speed computes from response and tool records: 1000 is the reference level, there is no upper limit, and higher is faster. Here the records of each source and model are pooled over the selected range, and a score needs at least 20 timed requests; the daily trend shows only days with 20 or more. The reference values were calibrated on the developer's own logs, not an industry standard.","ja":"性能は、Agent Speed が応答とツールの記録から計算するベンチマーク的なスコアです。1000 が基準で上限はなく、高いほど速いことを表します。ここでは選んだ期間の記録をソースとモデルごとにまとめて計算し、スコアには計時できたリクエストが 20 件以上必要です。日ごとの推移には 20 件以上ある日だけを表示します。基準値は開発者の実際のログで調整したもので、業界標準ではありません。"},"history.perf.info.a11y":{"zh-Hant":"這些數字怎麼算","zh-Hans":"这些数字怎么算","en":"How these numbers are computed","ja":"数値の計算方法"},"history.perf.trend":{"zh-Hant":"每日趨勢 · %@","zh-Hans":"每日趋势 · %@","en":"Daily trend · %@","ja":"日ごとの推移 · %@"},"history.perf.trend.days":{"zh-Hant":"截至 %@ 的 14 天","zh-Hans":"截至 %@ 的 14 天","en":"14 days to %@","ja":"%@ までの 14 日間"},"history.perf.usual.line":{"zh-Hant":"平常 %@","zh-Hans":"平常 %@","en":"Usual %@","ja":"普段 %@"},"history.perf.usual.hint":{"zh-Hant":"同一個來源與模型在這台電腦上，今天之前 14 天合併計算的分數；面板與看板上的「比平常」就是和它相比。","zh-Hans":"同一个来源与模型在这台电脑上，今天之前 14 天合并计算的分数；面板与看板上的“比平常”就是和它相比。","en":"The pooled score of this source and model on this computer over the 14 days before today, which “vs usual” on the dashboard and ed requests. Days whose logs were deleted before this version could analyze them keep their totals but have no performance data.","ja":"性能には計時できたリクエストが必要です。このバージョンが分析する前にログが削除された日は、合計だけが残り、性能のデータはありません。"},"history.perf.analyzing":{"zh-Hant":"正在重新分析過去的紀錄…","zh-Hans":"正在重新分析过去的记录…","en":"Re-analyzing past logs…","ja":"過去のログを再分析しています…"},"history.perf.footnote":{"zh-Hant":"每個來源與模型分開合併計算；每天至少要有 20 個有效計時請求才畫進趨勢。參考值依開發者的實際紀錄校準，不是業界標準。","zh-Hans":"每个来源与模型分开合并计算；每天至少要有 20 个有效计时请求才画进趋势。参考值依开发者的实际记录校准，不是业界标准。","en":"Each source and model is pooled on its own; a day needs 20 timed requests to appear in the trend. The reference values were calibrated on the developer's own logs, not an industry standard.","ja":"ソースとモデルごとにまとめて計算します。推移に表示するには 1 日に計時できたリクエストが 20 件必要です。基準値は開発者の実際のログで調整したもので、業界標準ではありません。"},"a11y.history.perf.chart":{"zh-Hant":"%@ 的每日性能：最低 %@，最高 %@，最近一天 %@","zh-Hans":"%@ 的每日性能：最低 %@，最高 %@，最近一天 %@","en":"Daily performance of %@: lowest %@, highest %@, latest %@","ja":"%@ の日ごとの性能：最低 %@、最高 %@、直近 %@"},"a11y.history.perf.chart.empty":{"zh-Hant":"%@ 的每日性能：這段期間沒有資料足夠的日子","zh-Hans":"%@ 的每日性能：这段期间没有数据足够的日子","en":"Daily performance of %@: no day in this period has enough data","ja":"%@ の日ごとの性能：この期間に十分なデータのある日はありません"},"a11y.history.perf.parts":{"zh-Hant":"構成：%@","zh-Hans":"构成：%@","en":"Breakdown: %@","ja":"内訳：%@"},"boards.subCount":{"zh-Hant":"%d 個子 agent","zh-Hans":"%d 个子 agent","en":"%d sub-agents","ja":"サブ agent %d 個"},"boards.moreSubs":{"zh-Hant":"+%d 個子 agent · %@","zh-Hans":"+%d 个子 agent · %@","en":"+%d sub-agents · %@","ja":"ほかのサブ agent %d 個 · %@"},"boards.moreGroups":{"zh-Hant":"還有 %d 個 agent · %@","zh-Hans":"还有 %d 个 agent · %@","en":"%d more agents · %@","ja":"ほか %d 個の agent · %@"},"boards.today":{"zh-Hant":"今日 %@","zh-Hans":"今日 %@","en":"Today %@","ja":"今日 %@"},"boards.peak":{"zh-Hant":"峰值 %@","zh-Hans":"峰值 %@","en":"Peak %@","ja":"ピーク %@"},"a11y.board":{"zh-Hant":"排行看板，%@：每秒 %@ 個 token，%@","zh-Hans":"排行看板，%@：每秒 %@ 个 token，%@","en":"Leaderboard, %@: %@ tokens per secon <script>
// Performance score prototype: renders every surface in both themes from DATA and PS_STRINGS (DESIGN §12, METRICS 6.9).
(function () {
  'use strict';

  const S = window.PS_STRINGS;
  const params = new URLSearchParams(location.search);
  const ui = {
    lang: params.get('lang') || 'zh-Hant',
    view: params.get('theme') || 'both',
    reduce: params.get('reduce') === '1' || matchMedia('(prefers-reduced-motion: reduce)').matches,
    contrast: params.get('contrast') === '1',
    isStatic: params.get('static') === '1',
    only: params.get('section'),
    scenario: 'base',
    selected: {},
  };

  // ── i18n ──────────────────────────────────────────────────────────────────────────────
  const esc = (s) => String(s).replace(/[&<>"']/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
  function raw(key) {
    const e = S[key];
    if (!e) return `⟨${key}⟩`;
    return e[ui.lang] ?? e.en;
  }
  function t(key, ...args) {
    let i = 0;
    return raw(key).replace(/%(%|@|d)/g, (m, c) => (c === '%' ? '%' : String(args[i++])));
  }

  // ── Formatting (DESIGN §12 Number formats; METRICS 7) ─────────────────────────────────
  const group = (v) => String(v).replace(/\B(?=(\d{3})+(?!\d))/g, ',');
  function sig3(x) { return x < 9.995 ? x.toFixed(2) : x < 99.95 ? x.toFixed(1) : x.toFixed(0); }
  function fmtCompact(v) {
    v = Math.round(v);
    if (v < 10000) return group(v);
    let s = sig3(v / 1000);
    if (parseFloat(s) >= 1000) return sig3(v / 1e6) + 'M';
    return s + 'k';
  }
  const fmtFull = (v) => (Math.round(v) >= 100000 ? fmtCompact(v) : group(Math.round(v)));
  const fmtForm = (v, form) => (form === 'compact' ? fmtCompact(v) : fmtFull(v));
  function fmtSpeed(v) {
    if (v === 0) return '0';
    if (v < 10) return v.toFixed(1);
    if (v < 1000) return String(Math.round(v));
    if (v < 10000) return (v / 1000).toFixed(2) + 'k';
    if (v < 100000) return (v / 1000).toFixed(1) + 'k';
    return Math.round(v / 1000) + 'k';
  }
  function fmtDur(ms) {
    if (ms < 999.5) return t('perf.unit.ms', Math.round(ms));
    const s = ms / 1000;
    if (s < 9.95) return t('perf.unit.s', s.toFixed(1));
    if (s < 59.5) return t('perf.unit.s', Math.round(s));
    const m = ms / 60000;
    return t('perf.unit.min', m < 9.95 ? m.toFixed(1) : Math.round(m));
  }
  const fmtPace = (n) => t('perf.unit.perMin', n < 9.95 ? n.toFixed(1) : Math.round(n));
  function fmtPct(x) { let p = Math.round(x * 100); if (x < 1 && p >= 100) p = 99; return p + '%'; }
  function signedPct(r) {
    const p = Math.round(r * 100);
    return p > 0 ? `+${p}%` : p < 0 ? `−${-p}%` : '±0%';
  }
  const logF = (v) => (v == null ? 0 : Math.max(0, Math.min(1, Math.log2(v / 250) / 4)));

  // ── The score (METRICS 6.9): weighted geometric mean of the present ratios ───────────
  const clamp = (r) => Math.max(0.05, Math.min(20, r));
  const COMPS = [
    { id: 'T', key: 'throughput', group: 'speed', w: 0.30, ratio: (m) => Math.max(0.01, m / 50), fmt: (m) => `${fmtSpeed(m)} ${t('unit.tokS')}` },
    { id: 'L', key: 'latency', group: 'speed', w: 0.20, ratio: (m) => clamp(5000 / Math.max(m, 250)), fmt: fmtDur },
    { id: 'R', key: 'reasoning', group: 'speed', w: 0.10, ratio: (m) => clamp(m / 20), fmt: (m) => `${fmtSpeed(m)} ${t('unit.tokS')}` },
    { id: 'N', key: 'pace', group: 'efficiency', w: 0.15, ratio: (m) => clamp(m / 3), fmt: fmtPace },
    { id: 'U', key: 'toolTime', group: 'efficiency', w: 0.10, ratio: (m) => clamp(400 / m), fmt: fmtDur },
    { id: 'S', key: 'toolSuccess', group: 'efficiency', w: 0.05, ratio: (m) => clamp(m / 0.95), fmt: fmtPct },
    { id: 'H', key: 'cache', group: 'efficiency', w: 0.10, ratio: (m) => clamp(m / 0.95), fmt: fmtPct },
  ];
  function evaluate(measures) {
    let sw = 0;
    let sl = 0;
    const parts = COMPS.map((c) => {
      const m = measures[c.id];
      if (m === 'nr' || m === 'few' || m == null) return { c, present: false, reason: m === 'few' ? 'fewSamples' : 'notRecorded' };
      const r = c.ratio(m);
      sw += c.w;
      sl += c.w * Math.log(r);
      return { c, present: true, m, r, sub: 1000 * r };
    });
    return { score: sw ? 1000 * Math.exp(sl / sw) : null, parts };
  }

  // ── Data: agents (METRICS 6.7 order) and history (METRICS 6.11) ──────────────────────
  const SOURCES = {
    codex: { key: 'source.codex', color: '#34D399' },

    opencode: { key: 'source.opencode', color: '#F4B13E' },
    gemini: { key: 'source.gemini', color: '#34B8F0' },
    pi: { key: 'source.pi', color: '#A855F7' },

  const srcName = (id) => t(SOURCES[id].key);

      measures: { T: 58, L: 6100, R: 'few', N: 2.4, U: 520, S: 0.89, H: 0.97 }, signals: { actions: 6 } },
    { id: 'vega', project: 'vega', source: 'pi', model: 'gpt-6.1-mini', effort: 'high', level: 3,
      tps: 41, phase: 'generating', depth: 0, lastLineMs: NOW - 1800, n: 14, C: 26, baseline: null,
      measures: { T: 40, L: 'nr', R: 'few', N: 4.2, U: 180, S: 1.0, H: 'few' }, signals: { novelty: 0.66, failed: 0, recovered: 0, actions: 14 } },
    { id: 'rocket', project: 'rocket', source: 'codex', model: 'gpt-6.1', effort: 'xhigh', level: 4, speed: 'fast',
      tps: 0, phase: 'tools', depth: 0, lastLineMs: NOW - 2400, n: 20, C: 37, baseline: 893,
      measures: { T: 30, L: 7400, R: 20, N: 2.9, U: 442, S: 0.96, H: 0.995 },
      signals: { looping: 4, novelty: 0.46, failed: 5, recovered: 1, actions: 23 } },
    { id: 'orbit', project: 'orbit', source: 'claudeCode', model: 'claude-opus-5-5', effort: 'high', level: 3,
      tps: 0, phase: 'idle', idle: true, depth: 0, lastLineMs: NOW - 240000, n: 20, C: 51, baseline: 1452,
      measures: { T: 92, L: 3600, R: 44, N: 5.1, U: 160, S: 0.98, H: 0.99 }, signals: { novelty: 0.81, failed: 1, recovered: 1, actions: 40 } },
    { id: 'lumen', project: 'lumen', source: 'gemini', model: 'gemini-3-pro', tps: 22, phase: 'generating', depth: 0,
      lastLineMs: NOW - 3000, n: 2, C: 0, baseline: null, measures: {}, signals: {} },
    { id: 'quasar', project: 'quasar', source: 'opencode', model: 'qwen4-coder-flash', tps: 640, phase: 'generating', depth: 0,
      lastLineMs: NOW - 500, n: 20, C: 0, baseline: 11880, galleryOnly: true,
      measures: { T: 642, L: 'nr', R: 'few', N: 'nr', U: 'nr', S: 'nr', H: 'few' }, signals: {} },
  ];
  const SCENARIOS = {

  const HEAT = [[0, '#7C8798'], [0.1, '#2DD4BF'], [0.3, '#38BDF8'], [0.48, '#818CF8'], [0.64, '#E879F9'], [0.78, '#FB7185'], [0.9, '#FB923C'], [1, '#FACC15']];

  // ── Menu bar and taskbar ─────────────────────────────────────────────────────────────

      `<span class="row"><span class="lb ghost">${esc(t('intel.glyph'))}</span><span class="nb ghost">8,888</span><span class="ub ghost">${esc(t('unit.tokS'))}</span></span>` +
      `<span class="row"><span class="lb ghost">${esc(t('intel.thinking.glyph'))}</span><span class="nb ghost">8.88k</span><span class="ub ghost"></span></span></span>`;

  function barWords(r) {
