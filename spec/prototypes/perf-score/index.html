  }
  function itemHTML(r, theme, kind, key) {
    const tps = r.form === 'live' ? r.tps || 707 : 0;
    return `<span class="item" role="img" aria-label="${esc(barWords(r))}">${gaugeSVG(kind === 'mac' ? 13 : 14, tps ? 0.62 : 0, theme)}` +
      `<span class="v${tps ? '' : ' is-idle'}">${fmtSpeed(tps)}</span><span class="unit">${esc(t('unit.tokS'))}</span>${rblockHTML(r, key)}</span>`;
  }
  function barSection(theme) {
    const top = topOf(agents());
    const live = top ? { v: top.v, prov: top.prov, form: top.form, n: top.n, think: 174 } : { v: null, think: 0 };
    const mac = `<div class="mbar">${itemHTML(live, theme, 'mac', 'bar-mac')}<span class="sys">${I.wifi}</span><span class="sys">${I.battery}</span><span class="sys tnum">15:42</span></div>`;
    const win = `<div class="tbar">${itemHTML(live, theme, 'win', 'bar-win')}<span class="tray">${I.caret}${I.wifi}${I.speaker}</span><span class="clock tnum">15:42<br>2026/10/29</span></div>`;
    const tip = top ? `<div class="hover-tip" style="margin-top:10px">707 tok/s · ${esc(barWords(live))}<div class="sub">${esc(t('perf.tooltip.top', fmtFull(top.v), top.agent.project))}</div></div>` : '';
    const states = READOUTS.map((s) => ({ ...s, think: s.think || 0 }));
    const grid = (kind) => states.map((s) => `<div class="bar-state"><div class="${kind === 'mac' ? 'mbar' : 'tbar'}">${itemHTML(s, theme, kind, '')}</div>` +
      `<div class="bar-label">${esc(stateLabel(s.label))}</div>${kind === 'mac' ? `<div class="vo">${esc(barWords(s))}</div>` : ''}</div>`).join('');
    return `<div class="tag">macOS</div>${mac}<div class="vo" style="text-align:left">${esc(barWords(live))}</div><div class="bar-states">${grid('mac')}</div>` +
      `<div class="tag" style="margin-top:24px">Windows</div>${win}${tip}<div class="bar-states">${grid('win')}</div>`;
  }

  // ── Board (glass M), sub-gauges of every style and row cells ──────────────────────────
  function capsuleHTML(a) {
    if (!a.effort && !a.speed) return '';
    const hs = [3.2, 4.4, 5.6, 6.8, 8];
    const meter = a.level ? `<span class="meter">${hs.map((h, i) => `<i class="${i < a.level ? 'on' : ''}" style="height:${h}px"></i>`).join('')}</span>` : '';
    return `<span class="capsule" aria-hidden="true">${meter}<span class="w">${esc(a.effort || '')}</span>${a.speed ? `<span class="bolt">${I.bolt}</span>` : ''}</span>`;
  }
  const ARC = { cx: 33, cy: 33, r: 29, sw: 3, tip: 2.3 };
  function glassArc(v, { prov = false, pale = false, uid }) {
    const { cx, cy, r, sw } = ARC;
    const rin = r - sw / 2 - 1;
    const tick = `<line x1="${cx}" y1="${(cy - rin).toFixed(2)}" x2="${cx}" y2="${(cy - rin + 3.3).toFixed(2)}" stroke="var(--b-ink-3)" stroke-width="1" stroke-linecap="round"/>`;
    const track = `<path d="${arcD(cx, cy, r, 150, 390)}" fill="none" stroke="var(--b-line-2)" stroke-width="${sw}" stroke-linecap="round"/>`;
    if (v == null) return track + tick;
    return `${track}${tick}<g class="val" data-arc="${uid}" data-prov="${prov ? 1 : 0}" data-pale="${pale ? 1 : 0}" opacity="${pale ? 0.35 : 1}">${glassArcValue(logF(v), prov, pale, uid)}</g>`;
  }
  function glassArcValue(f, prov, pale, uid) {
    const { cx, cy, r, sw, tip } = ARC;
    if (f <= 0) return '';
    const end = 150 + 240 * f;
    const ang = (end * Math.PI) / 180;
    const tx = cx + r * Math.cos(ang);
    const ty = cy + r * Math.sin(ang);
    const d = arcD(cx, cy, r, 150, end);
    const dash = prov ? ` stroke-dasharray="0 ${2 * sw}"` : '';
    const glow = pale || ui.contrast ? '' : `<path d="${d}" fill="none" stroke="var(--pearl-b)" stroke-opacity=".6" stroke-width="${sw}" stroke-linecap="round"${dash} filter="url(#sgf-${uid})"/>`;
    const tipEl = prov ? `<circle cx="${tx.toFixed(2)}" cy="${ty.toFixed(2)}" r="${tip}" fill="none" stroke="var(--pearl-b)" stroke-width="${(0.4 * tip).toFixed(2)}"/>`
      : `<circle cx="${tx.toFixed(2)}" cy="${ty.toFixed(2)}" r="${tip}" fill="#fff" stroke="var(--pearl-b)" stroke-width=".6"/>`;
    return `${glow}<path d="${d}" fill="none" stroke="${ui.contrast ? 'var(--b-ink)' : `url(#sgg-${uid})`}" stroke-width="${sw}" stroke-linecap="round"${dash}/>${tipEl}`;
  }
  function glassSG(o, uid, { key = '', think = 174, cost = '0.024' } = {}) {
    const pale = o.form === 'resting';
    const words = o.v == null ? t('intel.none') : t('perf.tooltip.top', fmtFull(o.v), o.who || '');
    return `<div class="sg${think === null ? ' no-t' : ''}" tabindex="0" data-card="${o.card || ''}" aria-label="${esc(words)}">` +
      `<svg viewBox="0 0 66 49" aria-hidden="true"><defs><linearGradient id="sgg-${uid}" x1="0" y1="1" x2="1" y2="0">` +
      '<stop offset="0" style="stop-color:var(--pearl-c)"/><stop offset=".5" style="stop-color:var(--pearl-a)"/><stop offset="1" style="stop-color:var(--pearl-b)"/></linearGradient>' +
      `<filter id="sgf-${uid}" x="-30%" y="-30%" width="160%" height="160%"><feGaussianBlur stdDeviation="1.5"/></filter></defs>` +
      `<g data-mk="${key}" data-mt="arc" data-uid="${uid}">${glassArc(o.v, { prov: o.prov, pale, uid })}</g></svg>` +
      `<div class="lab">${esc(t('intel.glyph'))}</div>` +
      `<div class="num${pale || o.v == null ? ' is-pale' : ''}">${numHTML(o.v, { key, prov: o.prov })}</div>` +
      (think === null ? '' : `<div class="tbl"><span class="l">${esc(t('intel.thinking.glyph'))}</span><span></span><span class="n${think ? '' : ' is-quiet'}">${think ? fmtSpeed(think) : '–'}</span><span class="u">${esc(t('unit.tokS'))}</span>` +
        `<span class="l">${esc(t('cost.glyph'))}</span><span></span><span class="n">${cost}</span><span class="u">US$/s</span></div>`) + '</div>';
  }
  function neonSG(o, key = '') {
    const pale = o.form === 'resting';
    const txt = o.v == null ? '–' : fmtFull(o.v);
    const ghost = txt.replace(/\d/g, '8');
    const lit = o.v == null ? 0 : Math.round(logF(o.v) * 12);
    return `<div class="ng" aria-hidden="true"><div class="lab">${esc(t('intel.glyph').toUpperCase())}</div>` +
      `<div class="digits">${o.v == null ? '' : `<span class="gh">${ghost}</span>`}<span class="lit${pale || o.v == null ? ' is-pale' : ''}">${o.v == null ? '–' : numHTML(o.v, { key, form: 'full', prov: o.prov })}</span></div>` +
      `<div class="meter${pale ? ' is-pale' : ''}${o.prov ? ' is-prov' : ''}" data-mk="${key}" data-mt="neon">${Array.from({ length: 12 }, (_, i) => `<i class="${i < lit ? 'on' : ''}"></i>`).join('')}</div></div>`;
  }
  function timingSG(o, key = '') {
    const pale = o.form === 'resting';
    return `<div class="tg" aria-hidden="true"><div class="r big"><span class="tab">${esc(t('intel.glyph').toUpperCase())}</span>` +
      `<span class="v${pale || o.v == null ? ' is-pale' : ''}">${o.v == null ? '–' : numHTML(o.v, { key, form: 'full', prov: o.prov })}</span></div>` +
      `<div class="r small"><span class="tab">${esc(t('intel.thinking.glyph').toUpperCase())}</span><span class="v${o.think ? '' : ' is-pale'}">${o.think ? fmtSpeed(o.think) : '–'}<small>TOK/S</small></span></div></div>`;
  }
  function sparkPath(w, h) {
    const pts = [];
    for (let i = 0; i < 60; i++) {
      const v = 0.52 + 0.22 * Math.sin(i / 6.5) + 0.12 * Math.sin(i / 2.1 + 1) + 0.06 * Math.sin(i * 1.7);
      pts.push([(i / 59) * w, h - 1.5 - Math.max(0, Math.min(1, v)) * (h - 3)]);
    }
    return pts.map((p, i) => `${i ? 'L' : 'M'}${p[0].toFixed(1)} ${p[1].toFixed(1)}`).join('');
  }
  function boardGroups(list) {
    const ls = inSets(list);
    return ls.filter((a) => a.depth === 0).map((r) => {
      const members = ls.filter((a) => a.id === r.id || a.parent === r.id);
      return { root: r, members, tps: members.reduce((s, a) => s + a.tps, 0), top: topOf(members) };
    }).sort((x, y) => y.tps - x.tps || y.root.lastLineMs - x.root.lastLineMs);
  }
  function boardSection(theme) {
    const list = agents();
    const top = topOf(list);
    const uid = `b-${theme}`;
    const total = 707;
    const heat = heatColor(0.62, theme === 'light' ? 0.22 : 0);
    const groups = boardGroups(list);
    const shown = groups.slice(0, 4);
    const rest = groups.slice(4);
    const rows = shown.map((g, i) => {
      const r = g.root;
      const tp = g.top;
      const pf = tp ? numHTML(tp.v, { key: `brow-${r.id}`, prov: tp.prov }) : '<span>–</span>';
      const detail = [r.model, r.subCount ? t('boards.subCount', r.subCount) : ''].filter(Boolean).join(' · ');
      const words = [t('a11y.board.row', i + 1, r.project, fmtSpeed(g.tps))];
      if (tp) words.push(t('a11y.agent.intel', scoreWords(tp.v, tp.prov, tp.form, tp.n)));
      return `<div class="brow" tabindex="0" data-card="group:${tp ? tp.agent.id : r.id}" data-area="board" aria-label="${esc(words.join('，'))}">` +
        `<span class="rk">${i + 1}</span><span class="bd" style="background:${r.phase === 'idle' ? 'var(--b-ink-3)' : srcColor(r.source)}"></span>` +
        `<span class="nm"><span class="l1"><b>${esc(r.project)}</b>${capsuleHTML(r)}</span><i>${esc(detail)}</i></span>` +
        `<span class="pf${!tp || tp.form === 'resting' ? ' is-pale' : ''}">${pf}</span>` +
        `<span class="bv${g.tps ? '' : ' is-quiet'}">${g.tps ? fmtSpeed(g.tps) : '–'}</span>` +
        (g.tps ? `<span class="share" style="color:${srcColor(r.source)};width:${((g.tps / total) * 250).toFixed(0)}px"></span>` : '') + '</div>';
    }).join('') + (rest.length ? `<div class="more">${esc(t('boards.moreGroups', rest.length, fmtSpeed(rest.reduce((s, g) => s + g.tps, 0))))}</div>` : '');
    const hero = { v: top && top.v, prov: top && top.prov, form: top ? top.form : 'none', who: top ? top.agent.project : '', card: 'hero' };
    const boardWords = [t('a11y.board', t('history.allSources'), fmtSpeed(total), t('title.jetliner')),
      top ? t('a11y.orb.intel', scoreWords(top.v, top.prov, top.form, top.n), fmtSpeed(174)) : t('intel.none')].join('，');
    const board = `<div class="board" role="list" aria-label="${esc(boardWords)}">` +
      `<div class="hero"><div class="hero-l"><div class="hero-v">${total}<small>tok/s</small></div>` +
      `<div class="hero-t" style="color:${heat}">${esc(t('title.jetliner'))}</div><div class="hero-c">${esc(t('agents.context', 3, 1))}</div></div>` +
      `${glassSG(hero, uid, { key: 'board-hero' })}</div>` +
      `<svg class="strip" viewBox="0 0 308 16" preserveAspectRatio="none" aria-hidden="true"><defs><linearGradient id="spf-${uid}" x1="0" y1="0" x2="0" y2="1">` +
      `<stop offset="0" stop-color="${heat}" stop-opacity=".28"/><stop offset="1" stop-color="${heat}" stop-opacity="0"/></linearGradient></defs>` +
      `<path d="${sparkPath(308, 16)}L308 16L0 16Z" fill="url(#spf-${uid})"/><path d="${sparkPath(308, 16)}" fill="none" stroke="${heat}" stroke-width="1.25"/></svg>` +
      `<div class="rank"><div class="caps" aria-hidden="true"><span class="hair"></span><span class="ci">${esc(t('intel.glyph'))}</span><span class="cv">${esc(t('unit.tokS'))}</span></div>${rows}</div>` +
      `<div class="foot"><span>${esc(t('boards.today', '128M'))} tok</span><b>US$42.15</b><span>${esc(t('boards.peak', '2.16k'))}</span></div></div>`;
    // Every style's sub-gauge across the states (DESIGN 2c, §12 Log scale).
    const HS = [
      { label: 'live', v: 1213, form: 'live', think: 174 }, { label: 'perf.provisional', v: 940, form: 'live', prov: true, think: 64 },
      { label: 'phase.idle', v: 1604, form: 'resting', think: 0 }, { label: '420', v: 420, form: 'live', think: 22 },
      { label: '12,840', v: 12840, form: 'live', think: 412 }, { label: 'intel.none', v: null, form: 'none', think: 0 },
    ];
    const heroGrid = `<div class="hero-grid"><span></span>${HS.map((h) => `<span class="hg-h">${esc(stateLabel(h.label))}</span>`).join('')}` +
      `<span class="hg-s">Glass</span>${HS.map((h, i) => `<div class="cell">${glassSG(h, `hg-${theme}-${i}`, { think: null })}</div>`).join('')}` +
      `<span class="hg-s">Neon</span>${HS.map((h) => `<div class="cell">${neonSG(h)}</div>`).join('')}` +
      `<span class="hg-s">Timing</span>${HS.map((h) => `<div class="cell">${timingSG(h)}</div>`).join('')}</div>`;
    const RS = [
      { name: 'nova · claude-opus-5-5', v: 1213, form: 'live', tps: 162 }, { name: 'nova · claude-sonnet-5-5', v: 940, form: 'live', prov: true, tps: 48 },
      { name: 'orbit · claude-opus-5-5', v: 1604, form: 'resting', tps: 0 }, { name: 'quasar · qwen4-coder-flash', v: 12840, form: 'live', tps: 640 },
      { name: 'lumen · gemini-3-pro', v: null, form: 'none', tps: 22 },
    ];
    const rowsDemo = `<div class="rows-demo">${['glass', 'timing', 'neon'].map((st) => `<div class="rd ${st}"><div class="rd-t">${st} · sub rows</div>${RS.map((r) =>
      `<div class="srow"><span class="bd" style="background:${r.tps ? '#FF8A65' : 'var(--b-ink-3)'}"></span><span class="nm">${esc(r.name)}</span>` +
      `<span class="pf${r.form !== 'live' ? ' is-pale' : ''}">${numHTML(r.v, { prov: r.prov })}</span><span class="bv">${r.tps ? fmtSpeed(r.tps) : '–'}</span></div>`).join('')}</div>`).join('')}</div>`;
    return `<div class="board-wrap">${board}<div class="card-slot" data-area="board"></div></div>` +
      `<div class="tag" style="margin-top:24px">Sub-gauge · M · log arc and meter (250 → 1000 half → 4000 full)</div>${heroGrid}` +
      `<div class="tag" style="margin-top:22px">Row cells · compact form, 8,888 cells</div>${rowsDemo}`;
  }

  // ── Dashboard ────────────────────────────────────────────────────────────────────────
  function badgeHTML(a) {
    if (a.phase === 'generating') return `<span class="dots3" style="color:${srcColor(a.source)}"><i></i><i></i><i></i></span>`;
    if (a.phase === 'tools') return `<span style="color:var(--ink-2);display:inline-flex">${I.hourglass}</span>`;
    return '<span class="idle-dot"></span>';
  }
  function dashRow(a) {
    const s = a.signals || {};
    const loop = s.looping ? `<span class="loop">${I.loop}</span>` : '';
    const pf = numHTML(a.shown, { key: `dash-${a.id}`, prov: a.prov });
    let lv;
    if (a.tps >= 0.05) lv = `<span class="lv">${fmtSpeed(a.tps)}</span>`;
    else if (a.phase === 'tools') lv = `<span class="lv" style="color:var(--ink-2)">${I.hourglass}</span>`;
    else lv = '<span class="lv is-quiet">–</span>';
    const words = [a.project, a.model, a.tps >= 0.05 ? `${fmtSpeed(a.tps)} tok/s` : t('phase.' + a.phase)];
    if (a.shown != null) words.push(t('a11y.agent.intel', scoreWords(a.shown, a.prov, a.form, 0)));
    if (s.looping) words.push(t('work.looping', s.looping));
    return `<div class="drow" tabindex="0" data-card="${a.id}" data-area="dashboard" aria-label="${esc(words.join('，'))}">` +
      (a.depth ? '<span class="indent"></span>' : '') +
      `<span class="badge">${badgeHTML(a)}</span><span class="namebox">${loop}<b>${esc(a.project)}</b><i>${esc(a.model)} · ${esc(srcName(a.source))}</i></span>` +
      `<span class="capcol">${capsuleHTML(a)}</span><span class="pf${a.form !== 'live' ? ' is-pale' : ''}">${pf}</span>${lv}</div>`;
  }
  function dashboardSection() {
    const list = inSets(agents());
    return `<div class="dash-wrap"><div class="card-slot" data-area="dashboard"></div>` +
      `<div class="panel dash" style="--capw:84px"><div class="p-head"><h3>${esc(t('dashboard.agents'))}</h3>` +
      `<span class="cap-i" title="${esc(t('agents.intel.hint'))}">${esc(t('intel.glyph'))}</span><span class="cap-v">${esc(t('unit.tokS'))}</span></div>` +
      `${list.map(dashRow).join('')}</div></div>` +
      `<div class="vo" style="text-align:right;margin-top:12px">${esc(t('agents.intel.hint'))}</div>`;
  }
  function cardsSection() {
    const list = agents();
    const by = (id) => list.find((a) => a.id === id);
    const top = topOf(list);
    const items = [
      ['live · Claude Code', by('nova'), {}], ['live · Codex · thinking', by('rocket'), {}],
      ['absent components · Pi', by('vega'), {}], ['provisional', by('nova-sub'), {}],
      ['resting', by('orbit'), {}], ['hero · highest of N', top.agent, { topN: top.n, key: 'hero' }],
      ['12,840 · very fast', by('quasar'), {}], ['none', by('lumen'), {}],
    ];
    return `<div class="cards-grid">${items.map(([cap, a, o]) => `<figure><figcaption>${esc(cap)}</figcaption>${cardHTML(a, { key: 'g-' + (o.key || a.id), ...o })}</figure>`).join('')}</div>`;
  }

  // ── Usage History: 性能表現 ──────────────────────────────────────────────────────────
  const HCOLS = ['throughput', 'latency', 'reasoning', 'pace', 'toolTime', 'toolSuccess', 'cache'];
  const compOf = (row, key) => row.parts.find((p) => p.c.key === key);
  function compCell(row, key) {
    const p = compOf(row, key);
    if (!p.present) {
      const hint = p.reason === 'notRecorded' ? t('perf.reason.notRecorded.hint', srcName(row.source)) : t('perf.reason.fewSamples.hint', 3);
      return `<td class="col-comp na" title="${esc(hint)}">–</td>`;
    }
    return `<td class="col-comp" title="${esc(t('perf.comp.' + key) + ' · ' + fmtFull(p.sub))}">${esc(p.c.fmt(p.m))}</td>`;
  }
  function partsCell(row) {
    const words = row.parts.map((p) => `${t('perf.comp.' + p.c.key)} ${p.present ? fmtFull(p.sub) : '–'}`).join(t('list.separator'));
    return `<td class="col-parts"><span class="fp" role="img" aria-label="${esc(t('a11y.history.perf.parts', words))}">${row.parts.map((p) =>
      p.present ? `<i style="--f:${logF(p.sub).toFixed(3)}" title="${esc(t('perf.comp.' + p.c.key) + ' · ' + p.c.fmt(p.m) + ' · ' + fmtFull(p.sub))}"></i>` : '<i class="na"></i>').join('')}</span></td>`;
  }
  function meterHTML(v, w = 36) { return `<span class="mm" style="width:${w}px" aria-hidden="true"><i style="width:${(logF(v) * 100).toFixed(1)}%"></i><b></b></span>`; }
  function sortRows(rows) { return [...rows].sort((a, b) => (b.has - a.has) || (a.has ? b.score - a.score : b.n - a.n) || (a.model < b.model ? -1 : 1)); }
  function chartSVG(row, width, height, theme) {
    const days = dailyOf(row);
    const pts = days.filter((d) => d.v != null);
    const maxV = Math.max(4000, ...pts.map((d) => d.v));
    const topV = 250 * Math.pow(2, Math.ceil(Math.log2(maxV / 250)));
    const padL = 34;
    const padR = 8;
    const padT = 8;
    const padB = 18;
    const W = width;
    const H = height;
    const y = (v) => padT + (1 - Math.log2(v / 250) / Math.log2(topV / 250)) * (H - padT - padB);
    const x = (i) => padL + ((i + 0.5) / days.length) * (W - padL - padR);
    const col = srcColor(row.source);
    let grid = '';
    for (let v = 500; v <= topV; v *= 2) {
      grid += `<line class="${v === 1000 ? 'ref' : 'grid'}" x1="${padL}" x2="${W - padR}" y1="${y(v).toFixed(1)}" y2="${y(v).toFixed(1)}"/>` +
        `<text class="ax${v === 1000 ? ' ref' : ''}" x="${padL - 6}" y="${(y(v) + 3).toFixed(1)}" text-anchor="end">${fmtFull(v)}</text>`;
    }
    const segs = [];
    let cur = [];
    days.forEach((d, i) => { if (d.v == null) { if (cur.length) segs.push(cur); cur = []; } else cur.push([x(i), y(d.v)]); });
    if (cur.length) segs.push(cur);
    const gid = `ag-${row.seed}-${theme}-${W}`;
    const line = segs.filter((s) => s.length > 1).map((s) => `M${s.map((p) => `${p[0].toFixed(1)} ${p[1].toFixed(1)}`).join('L')}`).join('');
    const area = segs.filter((s) => s.length > 1).map((s) => `M${s[0][0].toFixed(1)} ${H - padB}L${s.map((p) => `${p[0].toFixed(1)} ${p[1].toFixed(1)}`).join('L')}L${s[s.length - 1][0].toFixed(1)} ${H - padB}Z`).join('');
    const lastI = days.map((d) => d.v != null).lastIndexOf(true);
    const dots = days.map((d, i) => (d.v == null ? '' : `<circle cx="${x(i).toFixed(1)}" cy="${y(d.v).toFixed(1)}" r="${i === lastI ? 3 : 2.25}" fill="${col}" stroke="var(--win)" stroke-width="1.5"/>`)).join('');
    const usual = row.usual ? `<line x1="${padL}" x2="${W - padR}" y1="${y(row.usual).toFixed(1)}" y2="${y(row.usual).toFixed(1)}" stroke="${col}" stroke-opacity=".6" stroke-dasharray="4 3"/>` : '';
    const months = days.map((d, i) => (d.day.getDate() === 1 ? `<line x1="${(x(i) - (W - padL - padR) / days.length / 2).toFixed(1)}" x2="${(x(i) - (W - padL - padR) / days.length / 2).toFixed(1)}" y1="${padT}" y2="${H - padB}" stroke="var(--line)"/>` +
      `<text class="ax" x="${x(i).toFixed(1)}" y="${H - 4}">${d.day.getMonth() + 1}/1</text>` : '')).join('');
    const nearMonth = days.slice(0, 5).some((d) => d.day.getDate() === 1);
    const firstLab = (nearMonth ? '' : `<text class="ax" x="${x(0).toFixed(1)}" y="${H - 4}">${days[0].day.getMonth() + 1}/${days[0].day.getDate()}</text>`) +
      `<text class="ax" x="${x(days.length - 1).toFixed(1)}" y="${H - 4}" text-anchor="end">${days[days.length - 1].day.getMonth() + 1}/${days[days.length - 1].day.getDate()}</text>`;
    const vals = pts.map((d) => d.v);
    const label = vals.length ? t('a11y.history.perf.chart', `${row.model} · ${srcName(row.source)}`, fmtFull(Math.min(...vals)), fmtFull(Math.max(...vals)), fmtFull(vals[vals.length - 1]))
      : t('a11y.history.perf.chart.empty', `${row.model} · ${srcName(row.source)}`);
    const empty = vals.length ? '' : `<text x="${(W + padL) / 2}" y="${H / 2}" text-anchor="middle" style="font-size:12px;fill:var(--ink-3)">${esc(label)}</text>`;
    return `<svg class="chart" viewBox="0 0 ${W} ${H}" preserveAspectRatio="none" style="height:${H}px" role="img" aria-label="${esc(label)}">` +
      `<defs><linearGradient id="${gid}" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="${col}" stop-opacity=".12"/><stop offset="1" stop-color="${col}" stop-opacity="0"/></linearGradient></defs>` +
      `${grid}${months}${firstLab}<path d="${area}" fill="url(#${gid})"/><path d="${line}" fill="none" stroke="${col}" stroke-width="2" stroke-linejoin="round" stroke-linecap="round"/>${usual}${dots}${empty}</svg>`;
  }
  function ppHTML(mode, theme, width) {
    const head = `<div class="pp-head"><h2>${esc(t('history.perf.title'))}</h2><button class="info" title="${esc(t('history.perf.info.a11y'))}" aria-label="${esc(t('history.perf.info.a11y'))}">i</button></div>`;
    if (mode === 'empty') {
      return `<div class="pp">${head}<div class="pp-state"><span class="gl">${I.gaugeMuted}</span><b>${esc(t('history.perf.empty'))}</b><span>${esc(t('history.perf.empty.hint'))}</span></div></div>`;
    }
    if (mode === 'analyzing') {
      return `<div class="pp">${head}<div class="skel">${'<i></i>'.repeat(1)}<i style="height:90px;border-radius:8px"></i><i></i><i style="width:84%"></i><i style="width:92%"></i><i style="width:70%"></i></div>` +
        `<div class="pp-state" style="padding:12px 0 2px"><span>${esc(t('history.perf.analyzing'))}</span></div></div>`;
    }
    const rows = sortRows(HROWS);
    const selKey = ui.selected[theme + width] || [...rows].sort((a, b) => b.n - a.n)[0].key;
    const sel = rows.find((r) => r.key === selKey) || rows[0];
    const chartW = Math.max(300, width - 48 - 36);
    const chartH = width >= 860 + 84 ? 150 : width >= 600 + 84 ? 132 : 120;
    const legend = `<span class="legend"><span><svg width="12" height="2"><line x1="0" x2="12" y1="1" y2="1" stroke="currentColor" stroke-opacity=".7"/></svg>1000 ${esc(t('perf.reference'))}</span>` +
      (sel.usual ? `<span><svg width="12" height="2"><line x1="0" x2="12" y1="1" y2="1" stroke="${srcColor(sel.source)}" stroke-dasharray="4 3"/></svg>${esc(t('history.perf.usual.line', fmtFull(sel.usual)))}</span>` : '') + '</span>';
    const trend = `<div class="trend-t"><span class="tt">${esc(t('history.perf.trend', '')).replace(/\s*·\s*$/, ' · ')}<b>${esc(sel.model)}</b> · ${esc(srcName(sel.source))}</span>${legend}</div>` +
      chartSVG(sel, chartW, chartH, theme);
    const hdr = `<thead><tr><th>${esc(t('history.perf.column.model'))}</th><th title="${esc(t('history.perf.column.score'))}">${esc(t('history.perf.column.score'))}<span class="sort">▾</span></th>` +
      `<th title="${esc(t('history.perf.usual.hint'))}">${esc(t('history.perf.column.usual'))}</th><th title="${esc(t('history.perf.column.timed.full'))}">${esc(t('history.perf.column.timed'))}</th>` +
      HCOLS.map((k) => `<th class="col-comp" title="${esc(t('perf.comp.' + k) + ' — ' + t('perf.comp.' + k + '.desc'))}">${esc(t('history.perf.column.' + k))}</th>`).join('') +
      `<th class="col-parts">${esc(t('history.perf.column.parts'))}</th></tr></thead>`;
    const body = rows.map((r) => `<tr class="${r.has ? '' : 'low'}${r.key === sel.key ? ' sel' : ''}" data-sel="${r.key}" data-scope="${theme + width}">` +
      `<td><span class="mcell"><span class="sdot" style="background:${srcColor(r.source)}"></span><span class="id">${esc(r.model)}</span><span class="src">${esc(srcName(r.source))}</span>` +
      `${r.has ? '' : `<span class="chip-sm" title="${esc(t('history.perf.sample.hint', r.n, 20))}">${esc(t('history.perf.sample.low'))}</span>`}</span></td>` +
      `<td>${r.has ? `<span class="scell"><b>${fmtFull(r.shown)}</b>${meterHTML(r.shown)}</span>` : `<span class="na" title="${esc(t('history.perf.sample.hint', r.n, 20))}">–</span>`}</td>` +
      `<td${r.usual ? '' : ` class="na" title="${esc(t('perf.usual.none.hint', 20))}"`}>${r.usual ? `<span style="color:var(--ink-2)">${fmtFull(r.usual)}</span>` : '–'}</td>` +
      `<td>${group(r.n)}</td>${HCOLS.map((k) => compCell(r, k)).join('')}${partsCell(r)}</tr>`).join('');
    const list = rows.map((r) => {
      const comps = r.parts.filter((p) => p.present).map((p) => `${t('history.perf.column.' + p.c.key)} ${p.c.fmt(p.m)}`).join(' · ');
      const l2 = [srcName(r.source), t('history.perf.requests', group(r.n)), r.usual ? `${t('history.perf.column.usual')} ${fmtFull(r.usual)}` : ''].filter(Boolean).join(' · ');
      return `<div class="pi${r.has ? '' : ' low'}${r.key === sel.key ? ' sel' : ''}" data-sel="${r.key}" data-scope="${theme + width}" tabindex="0">` +
        `<div class="l1"><span class="sdot" style="background:${srcColor(r.source)}"></span><span class="id">${esc(r.model)}</span>` +
        `${r.has ? '' : `<span class="chip-sm">${esc(t('history.perf.sample.low'))}</span>`}<span class="r">${r.has ? `<span class="scell"><b>${fmtFull(r.shown)}</b>${meterHTML(r.shown)}</span>` : '<span class="na">–</span>'}</span></div>` +
        `<div class="l2">${esc(l2)}</div><div class="l3">${esc(comps)}</div></div>`;
    }).join('');
    return `<div class="pp" role="group" aria-label="${esc(t('history.perf.title'))}">${head}${trend}<table class="ptbl">${hdr}<tbody>${body}</tbody></table><div class="plist">${list}</div>` +
      `<div class="pp-foot">${esc(t('history.perf.footnote'))}</div></div>`;
  }
  function hwinHTML(width, inner, narrow) {
    const ranges = ['today', 'yesterday', '7d', '30d', '90d', 'year', 'all', 'custom'];
    const seg = narrow ? `<span class="tb-pop" style="margin-left:auto">${esc(t('history.range.30d'))} ${I.chev}</span>`
      : `<span class="tb-seg">${ranges.map((r) => `<span class="${r === '30d' ? 'on' : ''}">${esc(t('history.range.' + r))}</span>`).join('')}</span><span class="tb-pop">${esc(t('history.export'))}</span>`;
    return `<div class="hwin${width < 800 && !narrow ? ' compact' : ''}" style="width:${width}px;max-width:100%"><div class="hbar"><span class="lights"><i></i><i></i><i></i></span>` +
      `<span class="tb-pop"><span class="sdot" style="background:conic-gradient(#34D399 0 33%,#FF8A65 0 66%,#A855F7 0)"></span>${esc(t('history.allSources'))} ${I.chev}</span>${seg}</div>` +
      `<div class="hbody"${narrow ? ' style="padding:18px 16px 16px"' : ''}><h1>${esc(t('history.title'))}</h1><div class="range">2026/9/30 – 10/29 · ${esc(t('history.range.30d'))}</div>${inner}</div>` +
      `<div class="hfoot"><span></span><span class="lock">${I.lock}${esc(t(narrow ? 'history.privacy.short' : 'history.privacy'))}</span></div></div>`;
  }
  function historySection(theme) {
    return '<div class="hist-variants">' +
      `<div><div class="tag">Wide · 980</div>${hwinHTML(980, ppHTML('full', theme, 980))}</div>` +
      `<div class="hist-row"><div><div class="tag">Medium · 740 (the window's minimum is 720)</div>${hwinHTML(740, ppHTML('full', theme, 740))}</div>` +
      `<div style="flex:1;min-width:0;max-width:440px"><div class="tag">Narrow · 440</div>${hwinHTML(440, ppHTML('full', theme, 440), true)}</div></div>` +
      `<div><div class="tag">States</div><div class="states-row"><div>${ppHTML('analyzing', theme, 600)}</div><div>${ppHTML('empty', theme, 600)}</div></div></div></div>`;
  }

  // ── Scale and formats reference ──────────────────────────────────────────────────────
  function scaleSection() {
    const zones = [[250, 700, 'slow'], [700, 1300, 'standard'], [1300, 2000, 'fast'], [2000, 4000, 'veryFast']];
    const zcol = { slow: 'color-mix(in srgb, var(--ink) 10%, transparent)', standard: 'color-mix(in srgb, var(--pearl-c) 45%, transparent)',
      fast: 'color-mix(in srgb, var(--pearl-a) 55%, transparent)', veryFast: 'color-mix(in srgb, var(--pearl-b) 60%, transparent)' };
    const ruler = `<div class="ruler" aria-hidden="true">${zones.map(([a, b, k]) => `<div class="zone" style="left:calc(${logF(a) * 100}% + 1px);width:calc(${(logF(b) - logF(a)) * 100}% - 2px);background:${zcol[k]}"></div>` +
      `<span class="zl" style="left:${((logF(a) + logF(b)) / 2) * 100}%">${esc(t('perf.tier.' + k))}</span>`).join('')}` +
      [250, 500, 700, 1000, 1300, 2000, 4000].map((v) => `<i class="bar" style="left:${logF(v) * 100}%"></i><span class="tick${v === 1000 ? ' ref' : ''}" style="left:${logF(v) * 100}%">${fmtFull(v)}</span>`).join('') + '</div>';
    const vals = [0, 986, 1286, 9999, 10000, 12840, 99949, 99960, 128400, 999500, 1284000];
    const tbl = `<table class="fmt"><thead><tr><th>v</th><th>full</th><th>compact</th><th>f (log)</th><th>tier</th></tr></thead><tbody>${vals.map((v) =>
      `<tr><td class="c">${v}</td><td class="c">${fmtFull(v)}</td><td class="c">${fmtCompact(v)}</td><td class="c">${logF(v).toFixed(3)}</td><td>${esc(t('perf.tier.' + tierKey(v)))}</td></tr>`).join('')}</tbody></table>`;
    return ruler + tbl;
  }

  // ── Page assembly ─────────────────────────────────────────────────────────────────────
  const SECTIONS = [
    ['scale', '對數刻度與數字格式', 'f = clamp(log2(v / 250) / 4, 0, 1)：250 為空、1000 在正中、4000 以上全滿。tier 文字只用在卡片摘要。compact 在 10,000 以上取三位有效數字（k / M），格寬一律以 8,888 量測。', scaleSection, false],
    ['orb', '懸浮窗讀數', '性能（compact）在上、思考在下；初步分數有虛線底；閒置淡色並在思考為 0 時收成一行；沒有分數時為「–」。上排的懸浮窗跟著「新回應」按鈕計數變化。', orbSection, false],
    ['bar', '選單列 / 工作列', '固定寬度的兩行區塊：數字格以 8,888 與 8.88k 中較寬者量測，數值改變時就地替換、不計數。', barSection, false],
    ['board', '排行看板', '光環副錶的弧線改為對數刻度，正上方的刻痕是參考水準 1000；數字以 compact 形式並縮小到 8,888 放得進弧內。霓虹與計時塔用完整數字。滑過列或副錶會顯示性能分析卡。', boardSection, true],
    ['dashboard', '儀表板 · 性能欄', '性能欄寬 35 pt（8,888）；滑過或以鍵盤聚焦一列（空白鍵）會在面板旁顯示性能分析卡。', dashboardSection, true],
    ['cards', '性能分析卡', '320 寬：大數字、比平常、對數刻度、摘要，以及速度與效率兩組分項（實測值、迷你刻度、分項分數、說明）。缺少的分項說明原因，從不顯示假的 0。', cardsSection, true],
    ['history', '用量歷史 · 性能表現', '依來源與模型合併整段期間；點選一列即在上方顯示它的每日趨勢、參考線 1000 與平常線。寬版顯示每個分項，中版收成「構成」小圖，窄版變成清單。', historySection, true],
  ];
  function render() {
    document.documentElement.lang = ui.lang;
    document.body.dataset.view = ui.view;
    document.body.classList.toggle('reduce', ui.reduce);
    document.body.classList.toggle('static', ui.isStatic);
    document.body.classList.toggle('hc', ui.contrast);
    const prev = snapshot();
    const html = SECTIONS.filter(([id]) => !ui.only || ui.only === id).map(([id, title, desc, fn, stack]) =>
      `<section class="sec" id="sec-${id}"><div class="sec-head"><h2>${esc(title)}</h2><p>${esc(desc)}</p></div>` +
      `<div class="pair${stack ? ' one' : ''}">${['dark', 'light'].map((th) => `<div class="theme-col" data-theme="${th}"><div class="wall"></div>` +
        `<span class="col-tag">${th}</span>${fn(th)}</div>`).join('')}</div></section>`).join('');
    document.getElementById('sections').innerHTML = html;
    restoreCards();
    animateFrom(prev);
    bindHover();
    bindHistory();
    syncControls();
  }

  // ── Motion (DESIGN §12 Motion): count both ways, calmly; Reduce Motion crossfades ─────
  const running = new Map();
  function snapshot() {
    const m = {};
    document.querySelectorAll('[data-k][data-v]').forEach((el) => {
      if (!el.dataset.k) return;
      const k = el.closest('[data-theme]')?.dataset.theme + '|' + el.dataset.k;
      m[k] = +(el.dataset.shown || el.dataset.v);
    });
    return m;
  }
  const easeOut = (x) => 1 - Math.pow(1 - x, 3);
  function updateMeters(root, key, v) {
    root.querySelectorAll(`[data-mk="${key}"]`).forEach((m) => {
      const f = logF(v);
      if (m.dataset.mt === 'scale') m.style.setProperty('--f', f.toFixed(4));
      else if (m.dataset.mt === 'neon') m.querySelectorAll('i').forEach((i, n) => i.classList.toggle('on', n < Math.round(f * 12)));
      else if (m.dataset.mt === 'arc') {
        const g = m.querySelector('g.val');
        if (g) g.innerHTML = glassArcValue(f, g.dataset.prov === '1', g.dataset.pale === '1', m.dataset.uid);
      }
    });
  }
  function animateFrom(prev) {
    if (ui.isStatic) return;
    document.querySelectorAll('[data-k][data-v]').forEach((el) => {
      if (!el.dataset.k) return;
      const theme = el.closest('[data-theme]');
      const k = theme?.dataset.theme + '|' + el.dataset.k;
      const from = prev[k];
      const to = +el.dataset.v;
      if (from == null || from === to) return;
      if (ui.reduce) {
        el.animate([{ opacity: 0 }, { opacity: 1 }], { duration: 150, easing: 'ease-out' });
        return;
      }
      if (Math.abs(to - from) < Math.max(3, 0.01 * from)) return;
      const dur = Math.min(0.7, Math.max(0.3, 0.3 + 0.35 * Math.abs(Math.log2(to / from)))) * 1000;
      const form = el.dataset.form;
      let t0 = null;
      const step = (now) => {
        if (t0 == null) t0 = now;
        const x = Math.max(0, Math.min(1, (now - t0) / dur));
        const v = Math.round(from + (to - from) * easeOut(x));
        el.textContent = fmtForm(v, form);
        el.dataset.shown = v;
        updateMeters(theme, el.dataset.k, v);
        if (x < 1) running.set(k, requestAnimationFrame(step));
        else { delete el.dataset.shown; running.delete(k); }
      };
      el.textContent = fmtForm(from, form);
      updateMeters(theme, el.dataset.k, from);
      cancelAnimationFrame(running.get(k));
      running.set(k, requestAnimationFrame(step));
    });
  }

  // ── Hover cards (dashboard and board) ────────────────────────────────────────────────
  let hoverTimer = 0;
  let hideTimer = 0;
  const openCards = {};
  function cardFor(id) {
    const list = agents();
    if (id === 'hero') { const top = topOf(list); return top ? cardHTML(top.agent, { topN: top.n, key: 'hero-card' }) : ''; }
    if (id.startsWith('group:')) { const a = list.find((x) => x.id === id.slice(6)); return a ? cardHTML(a, { key: 'open-' + a.id, group: true }) : ''; }
    const a = list.find((x) => x.id === id);
    return a ? cardHTML(a, { key: 'open-' + a.id }) : '';
  }
  function showCard(col, area, id, fresh) {
    const slot = col.querySelector(`.card-slot[data-area="${area}"]`);
    if (!slot) return;
    openCards[col.dataset.theme + area] = id;
    col.querySelectorAll(`[data-area="${area}"][data-card], .sg[data-card]`).forEach((r) => r.classList.toggle('is-open', r.dataset.card === id));
    slot.innerHTML = `<div class="${fresh ? 'card-float' : ''}" style="--slide:${area === 'dashboard' ? '2px' : '-2px'}">${cardFor(id)}</div>`;
  }
  function restoreCards() {
    document.querySelectorAll('.theme-col').forEach((col) => {
      ['dashboard', 'board'].forEach((area) => {
        const id = openCards[col.dataset.theme + area] || (area === 'dashboard' ? 'nova' : 'hero');
        showCard(col, area, id, false);
      });
    });
  }
  function bindHover() {
    document.querySelectorAll('[data-card]').forEach((row) => {
      const col = row.closest('.theme-col');
      const area = row.dataset.area || 'board';
      if (!row.dataset.card) return;
      const open = () => showCard(col, area, row.dataset.card, true);
      row.addEventListener('mouseenter', () => {
        clearTimeout(hideTimer);
        clearTimeout(hoverTimer);
        hoverTimer = setTimeout(open, area === 'dashboard' ? 450 : 350);
      });
      row.addEventListener('mouseleave', () => clearTimeout(hoverTimer));
      row.addEventListener('focus', open);
      row.addEventListener('keydown', (e) => { if (e.key === ' ') { e.preventDefault(); open(); } });
    });
  }
  function bindHistory() {
    document.querySelectorAll('[data-sel]').forEach((r) => {
      const pick = () => { ui.selected[r.dataset.scope] = r.dataset.sel; render(); };
      r.addEventListener('click', pick);
      r.addEventListener('keydown', (e) => { if (e.key === 'Enter' || e.key === ' ') { e.preventDefault(); pick(); } });
    });
  }

  // ── Controls ─────────────────────────────────────────────────────────────────────────
  function syncControls() {
    document.querySelectorAll('[data-lang]').forEach((b) => b.setAttribute('aria-pressed', String(b.dataset.lang === ui.lang)));
    document.querySelectorAll('.pg-top [data-view]').forEach((b) => b.setAttribute('aria-pressed', String(b.dataset.view === ui.view)));
    document.getElementById('reduce').checked = ui.reduce;
    document.getElementById('contrast').checked = ui.contrast;
  }
  document.querySelectorAll('[data-lang]').forEach((b) => b.addEventListener('click', () => { ui.lang = b.dataset.lang; render(); }));
  document.querySelectorAll('.pg-top [data-view]').forEach((b) => b.addEventListener('click', () => { ui.view = b.dataset.view; render(); }));
  document.getElementById('reduce').addEventListener('change', (e) => { ui.reduce = e.target.checked; render(); });
  document.getElementById('contrast').addEventListener('change', (e) => { ui.contrast = e.target.checked; render(); });
  document.querySelectorAll('[data-play]').forEach((b) => b.addEventListener('click', () => {
    ui.scenario = b.dataset.play === 'reset' ? 'base' : b.dataset.play;
    render();
  }));
  window.addEventListener('error', (e) => { document.getElementById('errors').textContent += e.message + '\n'; });
  render();
})();
</script>
</body>
</html>
